.app-passos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.app-passos section { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.app-passos section.este { border-color: rgba(var(--teal-rgb), .55); background: rgba(var(--teal-rgb), .07); }

.app-passos ol { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }

@media (max-width: 560px) { .app-passos { grid-template-columns: 1fr; } }
/* notificações deste aparelho (Minha conta) */

.notif-tipos .chk { min-height: 34px; font-size: 13.5px; }
.notif-ok { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--teal); }
.notif-ok .ic { width: 15px; height: 15px; }

/* ---------- Topos e personalizados ---------- */
.vista-sel { display: inline-flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.vista-sel .btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
/* Quadro ("esteira da produção"): foco do dia no alto, colunas por etapa em ordem de prazo e cartões em forma de ficha */
.tq-foco { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.tq-chip { display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 16px 0 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm); transition: background .15s, color .15s, border-color .15s, transform .1s; }
.tq-chip b { min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center; font-family: var(--font-head); font-size: 15px; font-weight: 800; background: var(--surface-2); color: var(--ink); }
.tq-chip.atraso b { background: var(--error); color: var(--bg); }
.tq-chip.hoje b { background: var(--rose-600); color: var(--bg); }
.tq-chip.amanha b { background: var(--gold); color: var(--bg); }
.tq-chip.entregar b { background: var(--teal); color: var(--bg); }
.tq-chip:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
.tq-chip:active:not(:disabled) { transform: translateY(1px); }
.tq-chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: var(--glow); }
.tq-chip:disabled { opacity: .5; cursor: default; box-shadow: none; }
.tq-chip:disabled b { background: var(--surface-2); color: var(--ink-3); }
.tq-limpar { margin-left: 4px; font-size: 13.5px; }
.tq { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, .75fr); gap: 14px; align-items: start; }
.tq-col { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 12px 10px 10px; min-width: 0; }
.tq-col::before { content: ''; position: absolute; left: 18px; right: 18px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--c); filter: var(--dot-filter); }
.tq-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 8px; padding: 4px 6px 12px; }
.tq-h h2 { font-family: var(--font-head); font-size: 16px; font-weight: 800; letter-spacing: -.01em; margin: 0; }
.tq-h small { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); }
.tq-n { font-family: var(--font-num); font-weight: 700; font-size: 13px; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center; background: rgba(var(--c-rgb), .18); color: var(--ink); }
.tq-cards { position: relative; display: grid; gap: 10px; min-height: 120px; align-content: start; border-radius: var(--r); transition: background .15s, box-shadow .15s; }
.tq-cards.sobre { background: rgba(var(--c-rgb), .08); box-shadow: inset 0 0 0 2px rgba(var(--c-rgb), .5); }
.tq-cards.sobre::after { content: attr(data-solte); position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: var(--c); color: var(--bg); font-size: 12.5px; font-weight: 700; white-space: nowrap; pointer-events: none; }
.tq-grupo { display: flex; align-items: center; gap: 8px; margin: 4px 6px -2px; font-size: 12.5px; font-weight: 700; letter-spacing: 0; color: var(--ink-3); }
.tq-grupo::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
.tq-grupo.atraso { color: var(--error); } .tq-grupo.hoje { color: var(--rose-600); } .tq-grupo.amanha { color: var(--gold); }
.tq-vazio { display: grid; justify-items: center; gap: 6px; margin: 0; padding: 26px 10px; text-align: center; color: var(--ink-3); font-size: 13px; border: 1.5px dashed var(--line-2); border-radius: var(--r); }
.tq-vazio .ic { width: 22px; height: 22px; opacity: .7; }
.tq-card { position: relative; display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden; transition: transform .15s var(--ease), box-shadow .15s, opacity .2s, filter .2s; }
.tq-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.tq-card[draggable="true"] { cursor: grab; }
.tq-card.arrastando { opacity: .45; transform: rotate(-1.5deg) scale(.98); }
.tq-card.chegou { animation: tqChegou 1.4s var(--ease); }
@keyframes tqChegou { 0% { transform: scale(.96); box-shadow: 0 0 0 0 rgba(var(--c-rgb), 0); } 25% { transform: scale(1.01); box-shadow: 0 0 0 4px rgba(var(--c-rgb), .45); } 100% { transform: none; box-shadow: var(--shadow-sm); } }
/* o prazo em cima: quanto mais perto, mais forte (atrasado: faixa cheia, não passa despercebido) */
.tq-prazo { display: flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tq-prazo .ic { width: 15px; height: 15px; flex: none; }
.tq-prazo em { margin-left: auto; font-style: normal; font-weight: 600; font-size: 12px; white-space: nowrap; }
.tq-card[data-urg="atraso"] .tq-prazo { background: var(--error); color: var(--bg); border-bottom-color: transparent; }
.tq-card[data-urg="hoje"] .tq-prazo { background: var(--rose-50); color: var(--rose-600); }
.tq-card[data-urg="amanha"] .tq-prazo { background: var(--warm-50); color: var(--gold); }
.tq-corpo { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: start; width: 100%; padding: 12px; text-align: left; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
.tq-mini { position: relative; width: 58px; height: 58px; border-radius: 14px; display: grid; place-items: center; background: rgba(var(--c-rgb), .14); color: var(--c); }
.tq-mini .ic { width: 26px; height: 26px; stroke-width: 1.6; filter: var(--dot-filter); }
/* a imagem fica por cima da caixinha, sem mexer no tamanho dela (no Safari, foto em pé com altura em % vazava para fora);
   o ícone do tipo fica embaixo e só aparece se a imagem não abrir (link quebrado, foto HEIC do iPhone) */
.tq-mini img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; box-shadow: 0 0 0 1px var(--line); }
.tq-mini img + .ic { visibility: hidden; }
.tq-mini.img-falhou img + .ic { visibility: visible; }
.tq-qtd { position: absolute; right: -6px; bottom: -6px; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font-size: 11.5px; font-weight: 700; box-shadow: 0 0 0 2px var(--surface); }
.tq-txt { display: grid; gap: 3px; min-width: 0; }
.tq-tipo { font-size: 12.5px; font-weight: 700; letter-spacing: 0; color: var(--ink-3); }
.tq-tit { font-size: 15px; font-weight: 700; line-height: 1.25; }
.tq-frase { font-family: var(--font-head); font-size: 17px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; color: var(--ink); overflow-wrap: anywhere; }
.tq-meta { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.tq-card .nw { white-space: nowrap; }
/* o próximo passo, na cor da etapa para onde o cartão vai */
.tq-ir { display: flex; align-items: center; justify-content: center; gap: 7px; margin: 0 12px 12px; min-height: 38px; border-radius: var(--r-sm); border: 1px solid rgba(var(--n-rgb), .42); background: rgba(var(--n-rgb), .12); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background .15s, transform .1s; }
.tq-ir::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--n); filter: var(--dot-filter); }
.tq-ir .ic { width: 15px; height: 15px; }
.tq-ir:hover { background: rgba(var(--n-rgb), .24); }
.tq-ir:active { transform: translateY(1px); }
@media (pointer: coarse) { .tq-ir { min-height: 44px; } }
/* entregues: compactos, sem pedir atenção */
.tq-col.fim .tq-cards { gap: 6px; }
.tq-card.mini { box-shadow: none; }
.tq-card.mini:hover { transform: none; box-shadow: var(--shadow-sm); }
.tq-card.mini .tq-corpo { grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; }
.tq-card.mini .tq-mini { width: 34px; height: 34px; border-radius: 10px; }
.tq-card.mini .tq-mini img { border-radius: 10px; }
.tq-card.mini .tq-mini .ic { width: 18px; height: 18px; }
.tq-card.mini .tq-tit { font-size: 13.5px; }
.tq-card.mini .tq-meta { font-size: 12px; }
/* foco: os cartões que não são do destaque ficam apagados */
.tq-quadro[data-foco="atraso"] .tq-card:not([data-urg="atraso"]), .tq-quadro[data-foco="hoje"] .tq-card:not([data-urg="hoje"]),
.tq-quadro[data-foco="amanha"] .tq-card:not([data-urg="amanha"]), .tq-quadro[data-foco="entregar"] .tq-card:not([data-st="pronto"]) { opacity: .28; filter: saturate(.3); }
.tq-quadro[data-foco] .tq-grupo { opacity: .55; }
.tq-abas { display: none; }
@media (max-width: 1199px) { .tq { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* datas na ficha do pedido de topo */
.tq-quando { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tq-quando .ic { width: 14px; height: 14px; flex: none; }
.tq-quando.hoje { color: var(--rose-600); }
.tq-quando.amanha { color: var(--gold); }
.tq-quando.atraso { color: var(--error); }
.tag.tp-pers { background: var(--teal-50); color: var(--teal); }
.it-topo { display: flex; flex-wrap: wrap; gap: 6px; }
.it-topo:empty { display: none; }
.it-topo .pill { padding: 1px 8px 1px 6px; }
.tp-refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.tp-refs a { position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); text-decoration: none; }
.tp-refs img, .tf-ref img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
/* imagem que não abre aqui: no lugar dela, o aviso (o link continua abrindo o arquivo) */
.ref-falhou { display: none; justify-items: center; align-content: center; gap: 4px; padding: 6px; text-align: center; font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--ink-2); }
.ref-falhou .ic { width: 20px; height: 20px; }
.img-falhou > .ref-falhou { display: grid; }
.tf-refs { display: flex; flex-wrap: wrap; gap: 8px; }
.tf-ref { position: relative; display: grid; place-items: center; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.tf-ref .btn { position: absolute; top: 4px; right: 4px; min-height: 0; width: 26px; height: 26px; padding: 0; background: rgba(0, 0, 0, .6); color: #fff; border: 0; }
.tf-add { width: 84px; height: 84px; border-radius: 10px; border: 1px dashed var(--line-2); display: grid; place-content: center; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; text-align: center; padding: 4px; }
.tf-add:hover { background: var(--surface-2); }
.tf-add:focus-within { outline: 3px solid rgba(var(--teal-rgb), .4); }
.tf-pago { align-content: end; padding-bottom: 10px; }
.tq-tvbar { display: none; }
/* celular: uma etapa por vez, escolhida nas abas (com quantos pedidos e um ponto quando tem algo atrasado ou para hoje) */
@media (max-width: 760px) {
  .tq-foco { flex-wrap: nowrap; overflow-x: auto; margin: 0 -14px 12px; padding: 2px 14px 4px; scrollbar-width: none; }
  .tq-foco::-webkit-scrollbar { display: none; }
  .tq-chip { flex: none; }
  .tq-abas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; margin-bottom: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
  .tq-aba { position: relative; display: grid; justify-items: center; gap: 3px; padding: 8px 2px 9px; border: 0; border-radius: 11px; background: none; color: var(--ink-3); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .tq-aba .tq-n { height: 22px; min-width: 24px; font-size: 12px; }
  .tq-aba[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* Gastos com topos: o que pagar a quem faz (em cima), a lista dos topos e o resumo do mês */

.gt-comeco { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }

.gt-cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 18px 22px 12px; }

/* colunas por dia */

.g-col.top .g-val { color: var(--ink); font-weight: 700; }
.g-eixo { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; padding: 10px 0 0 64px; border-top: 1px solid var(--line-2); margin-top: -1px; }
.g-eixo span { text-align: center; font-family: var(--font-num); font-size: 11px; color: var(--ink-3); }
.g-eixo b { display: block; font-family: var(--font-ui); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
/* barras horizontais */
.g-barras { display: grid; gap: 14px; }
.gb-txt { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; margin-bottom: 6px; }
.gb-txt span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gb-txt b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.gb-trilho { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.gb-trilho i { display: block; height: 100%; border-radius: 999px; background: var(--grafico); }
.gb-linha small { display: block; font-size: 12px; color: var(--ink-3); margin-top: 4px; }
/* Produção: um produto por linha; tocar abre os pedidos */
.pr-lista .skel { margin: 12px 22px; height: 56px; }
.pr-topo { margin: 0; padding: 12px 22px; font-size: 13px; color: var(--ink-3); }
.pr { border-top: 1px solid var(--line); }
.pr > summary { display: grid; grid-template-columns: minmax(0, 1fr) auto 84px; gap: 14px; align-items: center; padding: 14px 22px; cursor: pointer; list-style: none; }
.pr > summary::-webkit-details-marker { display: none; }
.pr > summary:hover, .pr[open] > summary { background: var(--surface-2); }
.pr-nome b { font-weight: 600; }
.pr small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.pr-q { text-align: right; font-variant-numeric: tabular-nums; }
.pr-q b { font-family: var(--font-head); font-size: 21px; font-weight: 800; }
.pr-n { text-align: right; font-size: 13px; color: var(--ink-3); }
.pr-det { padding: 2px 22px 10px; }
.pr-l { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.pr-l:first-child { border-top: 0; }
.pr-l .pr-d { color: var(--ink-2); font-size: 13px; }
.pr-l .obs { white-space: pre-line; color: var(--ink-2); }
.pr-l > b { font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  .pr-topo, .pr > summary, .pr-det { padding-left: 16px; padding-right: 16px; }
  .pr > summary { grid-template-columns: minmax(0, 1fr) auto; }
  .pr-n { display: none; }
  .pr-l { grid-template-columns: minmax(0, 1fr) auto; }
  .pr-l .pr-d { grid-column: 1 / -1; }
}
/* tabela dia a dia */
.sem-tab-wrap { overflow-x: auto; }
.sem-tab { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 12px; }
.sem-tab th, .sem-tab td { padding: 11px 22px; text-align: right; border-top: 1px solid var(--line); }
.sem-tab th:first-child { text-align: left; font-weight: 500; }
.sem-tab tbody th { text-transform: capitalize; }
.sem-tab thead th { font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--ink-3); background: var(--surface-2); border-top: 0; }
.sem-tab tbody tr:hover { background: var(--surface-2); }
.sem-tab tr.top th, .sem-tab tr.top td { color: var(--teal); font-weight: 700; }
.sem-tab tfoot th, .sem-tab tfoot td { font-weight: 700; border-top: 1px solid var(--line-2); }
@media (max-width: 640px) {
  .g-area, .g-eixo { padding-left: 0; gap: 4px; }
  .g-linha { left: 0; } .g-linha span { display: none; }
  .g-val { font-size: 10px; writing-mode: vertical-rl; transform: rotate(180deg); }
  .g-area { height: 200px; }
  .sem-tab th, .sem-tab td { padding: 10px 14px; }
  .sem-din strong { font-size: 21px; }
}

/* ---------- Prejuízos ---------- */
.prej-tab td:nth-child(2) { white-space: nowrap; }
.prej-tab td small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.prej-tab td, .prej-tab th { text-align: left; vertical-align: top; }
.prej-tab td.num, .prej-tab th:nth-child(n+5) { text-align: right; white-space: nowrap; }
.prj-resultados { display: grid; gap: 6px; margin-top: 12px; max-height: 340px; overflow-y: auto; }
.prj-res { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 11px 13px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: inherit; cursor: pointer; }
.prj-res:hover { background: var(--surface-2); border-color: var(--line-2); }
.prj-res span { min-width: 0; }
.prj-res strong { display: block; }
.prj-res small { display: block; color: var(--ink-3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prj-ped { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); margin-bottom: 14px; }
.prj-ped strong { display: block; font-size: 15px; }
.prj-ped small { color: var(--ink-3); font-size: 12.5px; }
.prj-itens { display: grid; gap: 8px; }
.prj-it { display: grid; grid-template-columns: minmax(0, 1fr) auto 170px; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.prj-it-t small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.prj-it-q { display: flex; align-items: center; gap: 4px; }
.prj-it-q .in { width: 62px; text-align: center; font-weight: 700; padding-left: 6px; padding-right: 6px; }
.prj-it-v .field { margin: 0; }
.prj-it-v .field > label { font-size: 12px; }
.prj-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--rose-50); }
.prj-total strong { font-family: var(--font-head); font-size: 22px; color: var(--rose-600); }
@media (max-width: 640px) {
  .prej-tab thead { display: none; }
  .prej-tab, .prej-tab tbody, .prej-tab tfoot { display: block; width: 100%; }
  .prej-tab tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
  .prej-tab tbody td { display: block; padding: 0; border: 0; text-align: left !important; white-space: normal !important; }
  .prej-tab tbody td:nth-child(1) { grid-column: 1; grid-row: 1; color: var(--ink-3); font-size: 12.5px; }
  .prej-tab tbody td:nth-child(2) { grid-column: 1; grid-row: 2; }
  .prej-tab tbody td:nth-child(3) { grid-column: 1 / -1; grid-row: 3; font-weight: 600; }
  .prej-tab tbody td:nth-child(4) { grid-column: 1; grid-row: 4; }
  .prej-tab tbody td:nth-child(5) { grid-column: 2; grid-row: 2; text-align: right !important; color: var(--ink-3); font-size: 12.5px; }
  .prej-tab tbody td:nth-child(6) { grid-column: 2; grid-row: 1; text-align: right !important; }
  .prej-tab tbody td:nth-child(7) { grid-column: 2; grid-row: 4; justify-self: end; }
  .prej-tab td:nth-child(2) small { display: inline; margin-left: 6px; }
  .prej-tab tfoot tr { display: flex; justify-content: space-between; padding: 12px 16px; }
  .prej-tab tfoot th, .prej-tab tfoot td { padding: 0; border: 0; }
  .prej-tab tfoot td:empty { display: none; }
  .kpi strong { font-size: 19px; }
  .kpi .delta { white-space: normal; }
}
@media (max-width: 640px) { .prj-it { grid-template-columns: minmax(0, 1fr) auto; } .prj-it-v { grid-column: 1 / -1; } }

/* Algarismos de largura fixa onde números alinham em coluna */
.valor-numerico, .ped .total, .valores .lin, .it-l, .pgto, .preco-in .in, .money .in, .np-item .sub, .hj-pg .falta, .hj-pagto, .hj-it .l, .hj-resumo,
.status-bar, .tbl, .kv dd, .pill, .tag, .nav-badge, .hj-falta-g { font-variant-numeric: tabular-nums; }

/* ---------- Campo de data com calendário (js/calendario.js) ---------- */
.dt { display: block; position: relative; }
.dt-btn { display: flex; align-items: center; gap: 9px; text-align: left; cursor: pointer; color: var(--ink); }
.dt-btn .ic { color: var(--teal); flex: none; }
.dt-btn .dt-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dt-btn.vazio .dt-txt { color: var(--ink-3); }
.dt-btn .dt-seta { width: 15px; height: 15px; color: var(--ink-3); transform: rotate(90deg); transition: transform .15s; }
.dt-btn[aria-expanded="true"] { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(var(--teal-rgb), .16); }
.dt-btn[aria-expanded="true"] .dt-seta { transform: rotate(-90deg); }
.dt-btn[aria-invalid="true"] { border-color: var(--error); }
.f-de .dt { display: inline-block; }
.dt-pop { position: fixed; z-index: 95; width: 304px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); animation: temaEntra .14s var(--ease); }
.dt-atalhos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.dt-atalhos:empty { display: none; }
.cal-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.cal-mes { font-family: var(--font-head); font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.cal-nav { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; }
.cal-nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cal-nav:hover:not(:disabled) { background: var(--surface-2); }
.cal-nav:disabled { opacity: .3; cursor: default; }
.cal-sem, .cal-grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal-sem span { padding: 6px 0 4px; text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.cal-dia { aspect-ratio: 1; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; }
.cal-dia:hover:not(:disabled) { background: var(--surface-2); }
.cal-dia.cal-hoje { box-shadow: inset 0 0 0 1.5px var(--teal); }
.cal-dia.cal-sel { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.cal-dia:disabled { color: var(--ink-3); opacity: .35; cursor: not-allowed; }
@media (pointer: coarse) { .dt-pop { width: min(340px, calc(100vw - 16px)); } .cal-nav { width: 42px; height: 42px; } .cal-dia { font-size: 15px; } }

/* ---------- Imagem para os stories (Relatório) ---------- */
.st-prev { display: grid; grid-template-columns: minmax(0, 290px) minmax(0, 1fr); gap: 24px; align-items: start; }
.st-img { aspect-ratio: 9 / 16; border-radius: 18px; overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); }
.st-img img { width: 100%; height: 100%; display: block; }
.st-img:focus { outline: none; }   /* recebe o foco ao abrir: no celular, a prévia fica à vista */
.st-img .skel { height: 100%; border-radius: 0; }
.st-op .chips { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 640px) { .st-prev { grid-template-columns: 1fr; } .st-img { width: min(100%, 260px); margin: 0 auto; } }

/* ---------- Peso final do bolo (sql/peso-final.sql) ---------- */
.pf { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.pf > label { display: block; font-weight: 600; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.pf > label span { font-weight: 400; color: var(--ink-3); }
.pf-in { display: flex; align-items: center; gap: 8px; }
.pf-in .in { width: 130px; min-height: 38px; font-family: var(--font-num); }
.pf-un { color: var(--ink-3); font-weight: 600; font-size: 13px; }
.pf .pf-st { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; font-size: 12.5px; line-height: 1.4; color: var(--ink-3); }
.pf .pf-st .ic { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.pf .pf-st.ok { color: var(--teal); font-weight: 600; }
.pf .pf-st.exc { color: var(--rose-600); font-weight: 600; }
.hj-it .pf { margin-top: 8px; background: var(--surface-2); }
.exc-tab td small { display: block; }

/* ---------- Entregas (sql/entregas.sql) ---------- */
.tag.ent { background: var(--ent-50); color: var(--ent); }
.ped .ent-tag, .hj-nome .ent-tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; color: var(--ent); }
.ent-tag .ic { width: 14px; height: 14px; }
.hj-nome small .ent-tag { vertical-align: -2px; }
.ent-card { border-color: rgba(var(--ent-rgb), .35); }
.ent-card .card-h h2 { display: flex; align-items: center; gap: 8px; }
.ent-card .card-h h2 .ic { color: var(--ent); }
.ent-end { margin: 2px 0 12px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--ent-50); font-size: 15px; line-height: 1.45; }
.ent-end b { display: block; font-size: 16px; }
.ent-end small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.ent-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.ent-acoes .btn { flex: 1 1 150px; }
.ent-acoes .sair { flex: 1 1 100%; min-height: 50px; font-size: 15.5px; }
.btn.ent { background: var(--ent); color: #fff; box-shadow: 0 12px 26px -12px rgba(var(--ent-rgb), .7); }
.btn.ent:hover { filter: brightness(1.07); }
:root[data-theme="dark"] .btn.ent, :root[data-theme="dracula"] .btn.ent { color: #0E1B26; }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .btn.ent { color: #0E1B26; } }
.ent-add { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-2); font-size: 13.5px; color: var(--ink-3); }
.ent-calc { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.ent-calc .field { flex: 1 1 160px; margin-bottom: 0; }
.ent-calc .btn { margin-bottom: 0; }
.ent-res { margin: 10px 0 0; padding: 10px 12px; border-radius: var(--r-sm); background: var(--ent-50); font-size: 13.5px; line-height: 1.45; }
.ent-res.aviso { background: var(--warm-50); }
.ent-res.erro { background: var(--error-50); color: var(--error); }
.ent-res small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.ent-res a { font-weight: 600; }
.ent-saida-ok { text-align: center; padding: 6px 0 2px; }
.ent-saida-ok .ok-ic { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--teal-50); color: var(--teal); }
.ent-saida-ok .ok-ic .ic { width: 30px; height: 30px; stroke-width: 2.4; }
.ent-saida-ok h3 { font-family: var(--font-head); font-size: 19px; margin: 0 0 4px; }
.ent-saida-ok p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; }
.ent-saida-ok .btn { width: 100%; }
.ent-saida-ok .btn + .btn { margin-top: 10px; }
.ent-saida-ok .waze { min-height: 56px; font-size: 17px; }
.hj-ent .ent-end { margin: 0 0 10px; font-size: 14px; }
.hj-ent .ent-end b { font-size: 15px; }
.hj-ent .lin { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 2px 0; }
.hj-ent .ent-acoes { margin-top: 10px; }
.hj-acoes .sair { flex: 1 1 260px; min-height: 52px; font-size: 16px; }
.aj-ent-prev { font-size: 12.5px; color: var(--ink-3); margin: -6px 0 14px; }
.aj-ent-mapa { font-size: 12.5px; margin: -6px 0 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.aj-ent-mapa.ok { color: var(--teal); }
.aj-ent-mapa.erro { color: var(--error); }

/* =========================================================
   V2: componentes novos (busca com resultados, próximo passo, etapas, rodapé da gaveta, menus, "Mais")
========================================================= */
/* Busca da barra de cima: resultados enquanto digita */
.busca-res { position: absolute; z-index: 60; top: calc(100% + 8px); left: 0; width: max(100%, 480px); max-height: min(70vh, 460px); overflow-y: auto; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); overscroll-behavior: contain; }
.br-it { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 9px 10px; border-radius: 12px; cursor: pointer; }
.br-it[aria-selected="true"] { background: var(--accent-wash); }
.br-q { font-weight: 800; font-size: 13px; line-height: 1.25; }
.br-q small, .br-m small { display: block; font-weight: 600; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br-m { min-width: 0; }
.br-m b { display: block; font-weight: 800; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br-todos { grid-template-columns: auto 1fr; color: var(--teal); font-weight: 800; font-size: 13.5px; border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; margin-top: 4px; }
.br-vazio { margin: 0; padding: 14px 12px 10px; color: var(--ink-2); font-size: 14px; }
@media (max-width: 991px) { .busca-res { position: fixed; top: 62px; left: 10px; right: 10px; width: auto; } }

/* Linha do pedido: a linha toda abre o pedido; o próximo passo é um botão à parte */
.ped { position: relative; }
.ped-abrir { position: absolute; inset: 0; z-index: 0; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; border-radius: inherit; -webkit-tap-highlight-color: transparent; }
.ped-abrir:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.ped:has(> .ped-abrir) > span { position: relative; pointer-events: none; }
.ped-acao { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: 11px; border: 1px solid rgba(var(--teal-rgb), .32); background: var(--teal-50); color: var(--teal); font: inherit; font-size: 13.5px; font-weight: 800; white-space: nowrap; cursor: pointer; transition: background .14s var(--ease), color .14s var(--ease), border-color .14s; }
.ped-acao .ic { width: 16px; height: 16px; }
.ped-acao:hover { background: var(--fita); border-color: var(--fita); color: var(--on-fita); }
.ped-acao.ent { border-color: rgba(var(--ent-rgb), .35); background: var(--ent-50); color: var(--ent); }
.ped-acao.ent:hover { background: var(--ent); border-color: var(--ent); color: #fff; }
.ped-acao[aria-busy="true"] { pointer-events: none; opacity: .7; }
/* lista estreita (cartões do painel, celular): o botão vai para baixo dos itens */
.lista-ped { container: lista / inline-size; }
.ped:has(> .ped-acao) .ped-acao { grid-column: 2 / -1; justify-self: start; margin-top: 4px; }
@container lista (min-width: 760px) {
  .ped:has(> .ped-abrir) { grid-template-columns: 112px minmax(0, 1fr) auto 176px; }
  .ped:has(> .ped-acao) .ped-acao { grid-column: 4; grid-row: 1; justify-self: end; margin: 0; }
}
@media (max-width: 640px) { .ped:has(> .ped-acao) .ped-acao { grid-column: 1 / -1; margin-top: 6px; min-height: 42px; } }

/* Gaveta: o caminho do pedido (etapas) */
.passos { list-style: none; margin: 0; padding: 2px 0 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.passos::-webkit-scrollbar { display: none; }
.passos li { flex: 1 1 0; min-width: 74px; position: relative; }
.passos li::before { content: ''; position: absolute; top: 15px; left: calc(-50% + 18px); right: calc(50% + 18px); height: 3px; border-radius: 3px; background: var(--line-2); }
.passos li:first-child::before { display: none; }
.passos li.feito::before, .passos li.atual::before { background: var(--fita); }
.passos button { width: 100%; display: grid; justify-items: center; gap: 7px; padding: 0 2px 2px; border: 0; background: none; border-radius: 12px; cursor: pointer; color: var(--ink-3); font: inherit; font-size: 12.5px; font-weight: 700; line-height: 1.2; text-align: center; }
.passos .pt { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line-2); transition: box-shadow .14s; }
.passos .pt .ic { width: 17px; height: 17px; stroke-width: 2.6; }
.passos li.feito .pt { background: var(--fita); color: var(--on-fita); box-shadow: none; }
.passos li.feito button { color: var(--ink-2); }
.passos li.atual .pt { box-shadow: inset 0 0 0 3px var(--fita), 0 0 0 5px rgba(81, 171, 157, .22); }
.passos li.atual .pt::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--logo-chocolate); }
:root[data-theme="dark"] .passos li.atual .pt::after, :root[data-theme="dracula"] .passos li.atual .pt::after { background: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .passos li.atual .pt::after { background: var(--ink); } }
.passos li.atual button { color: var(--ink); font-weight: 800; }
.passos button:hover .pt { box-shadow: inset 0 0 0 2px var(--teal); }
.passos li.feito button:hover .pt { box-shadow: 0 0 0 3px rgba(var(--teal-rgb), .25); }

/* Gaveta: rodapé fixo com quanto falta e o próximo passo */
.gav-b { padding-bottom: 24px; }
.gav-pe { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.gp-falta { margin-right: auto; display: grid; line-height: 1.15; min-width: 0; }
.gp-falta small { font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
.gp-falta b { font-size: 19px; font-weight: 800; color: var(--rose-600); }
.gp-falta.ok { display: flex; align-items: center; gap: 6px; color: var(--teal); font-weight: 800; font-size: 14px; }
.gav-pe .btn { min-height: 46px; }
.gav-pe .btn.teal { padding: 0 18px; }
@media (max-width: 480px) { .gav-pe { flex-wrap: wrap; } .gav-pe .btn.teal { flex: 1 1 100%; order: 3; } }

/* Gaveta: menus "Imprimir" e "Mais" */
.acoes-topo { align-items: center; }
.menu-acao { position: relative; }
.menu-acao > summary { list-style: none; }
.menu-acao > summary::-webkit-details-marker { display: none; }
.menu-acao .menu-seta { width: 14px; height: 14px; transform: rotate(90deg); opacity: .7; transition: transform .14s var(--ease); }
.menu-acao[open] .menu-seta { transform: rotate(-90deg); }
.menu-acao[open] > summary { background: var(--surface-2); }
.menu-pop { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 236px; padding: 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); display: grid; }
.menu-acao:last-of-type .menu-pop { left: auto; right: 0; }
.menu-pop > a, .menu-pop > button { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 10px; border: 0; background: none; color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; text-align: left; }
.menu-pop > a:hover, .menu-pop > button:hover { background: var(--surface-2); }
.menu-pop .perigo { color: var(--error); }

/* "Mais" do celular */
.mais-grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mais-it { position: relative; display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 84px; padding: 10px 6px; border-radius: 16px; border: 0; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; line-height: 1.2; text-align: center; text-decoration: none; cursor: pointer; }
.mais-it .ic { width: 22px; height: 22px; color: var(--teal); }
.mais-it[aria-current="page"] { background: var(--fita); color: var(--on-fita); }
.mais-it[aria-current="page"] .ic { color: var(--on-fita); }
.mais-it .nav-badge { position: absolute; top: 8px; right: 8px; margin: 0; }
.mais-sec { margin: 18px 2px 8px; font-size: 13px; font-weight: 700; color: var(--ink-3); }

/* Lista estreita (cartões do painel): coluna de data menor; cabeçalho da tabela com o "Próximo passo" */
@container lista (max-width: 520px) { .ped:has(> .ped-abrir) { grid-template-columns: 76px minmax(0, 1fr) auto; } }
.card.tabela { container: lista / inline-size; }
.tab-cab .tc-acao { display: none; }
@container lista (min-width: 760px) {
  .tab-cab { grid-template-columns: 112px minmax(0, 1fr) auto 176px; }
  .tab-cab .tc-acao { display: block; text-align: right; }
}

/* Pedidos em quadro: uma coluna por etapa */
.filtros.quadro .f-st { display: none; }
.quadro-ped { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; scroll-snap-type: x proximity; }
.qp-col { background: var(--surface-2); border-radius: var(--r); padding: 12px 10px 10px; scroll-snap-align: start; min-width: 0; }
.qp-h { display: flex; align-items: center; gap: 8px; padding: 2px 6px 10px; }
.qp-h .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--teal)); filter: var(--dot-filter); flex: none; }
.qp-h h2 { font-size: 15px; font-weight: 800; flex: 1; min-width: 0; }
.qp-n { min-width: 26px; height: 24px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--surface); font-weight: 800; font-size: 13px; color: var(--ink-2); }
.qp-lista { display: grid; gap: 8px; }
.qp-vazio { margin: 0; padding: 18px 8px; text-align: center; color: var(--ink-3); font-size: 13.5px; }
.qp-card { position: relative; display: grid; gap: 5px; padding: 12px 12px 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); transition: border-color .14s; min-width: 0; }   /* nunca mais largo que a coluna */
.qp-card:hover { border-color: rgba(var(--teal-rgb), .45); }
.qp-card > span, .qp-card > strong { position: relative; pointer-events: none; }
.qp-card.hoje { box-shadow: inset 3px 0 0 var(--rose-600); }
.qp-card.atraso { box-shadow: inset 3px 0 0 var(--error); }
.qp-quando { font-size: 13px; font-weight: 800; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.qp-card.hoje .qp-quando { color: var(--rose-600); }
.qp-card.atraso .qp-quando { color: var(--error); }
.qp-nome { font-size: 15px; font-weight: 800; line-height: 1.25; }
.qp-nome small { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.qp-itens { font-size: 13px; color: var(--ink-2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.qp-pe { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; margin-top: 2px; }
.qp-pe b { font-weight: 800; font-size: 14.5px; }
/* o botão do próximo passo quebra a linha quando o nome da etapa é comprido (senão empurra o cartão para a coluna do lado) */
.qp-card .ped-acao { width: 100%; margin-top: 4px; white-space: normal; text-align: center; line-height: 1.2; padding-top: 7px; padding-bottom: 7px; }
.tab-pe.quadro { border: 0; padding: 12px 4px 0; }
@media (max-width: 640px) { .quadro-ped { grid-auto-columns: 86%; margin: 0 -14px; padding: 0 14px 8px; scroll-padding: 0 14px; } }

/* Novo pedido: cliente reconhecido, atalhos de data, busca de produto e total no rodapé */
.np-cli { display: flex; align-items: flex-start; gap: 8px; margin: -4px 0 14px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--teal-50); color: var(--ink); font-size: 13.5px; line-height: 1.4; }
.np-cli .ic { width: 17px; height: 17px; color: var(--teal); margin-top: 1px; }
.np-cli.novo { background: var(--surface-2); color: var(--ink-2); }
.np-cli.novo .ic { color: var(--ink-3); }
.np-cli .link { padding: 0 0 0 4px; }
.np-dias { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.np-dias .chip { min-height: 32px; padding: 0 10px; font-size: 12.5px; }
.np-busca { position: relative; margin-bottom: 10px; }
.np-busca > .ic { position: absolute; left: 13px; top: 12px; color: var(--ink-3); width: 17px; height: 17px; }
.np-busca .in { padding-left: 40px; min-height: 44px; border-color: rgba(var(--teal-rgb), .45); }
.np-sug { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; right: 0; max-height: 300px; overflow-y: auto; padding: 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); }
.nps-it { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.nps-it[aria-selected="true"] { background: var(--accent-wash); }
.nps-it b { display: block; font-weight: 800; font-size: 14px; }
.nps-it small { display: block; font-size: 12.5px; color: var(--ink-3); }
.nps-p { font-weight: 800; font-size: 13.5px; white-space: nowrap; color: var(--teal); }
.nps-vazio { margin: 0; padding: 12px; color: var(--ink-2); font-size: 14px; }
.np-item.novo-item { animation: npEntra .9s var(--ease); }
@keyframes npEntra { 0% { box-shadow: 0 0 0 3px var(--fita); } 100% { box-shadow: 0 0 0 0 transparent; } }
.np-feito { margin: 16px 0 10px; }
.np-tot-f { display: grid; line-height: 1.15; }
.np-tot-f span { font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
.np-tot-f b { font-size: 20px; font-weight: 800; color: var(--ink); }
@media (max-width: 640px) { .np-tot-f { flex-basis: auto !important; margin-right: auto !important; } .modal-f:has(.np-tot-f) .btn.ghost { display: none; } }
@media (prefers-reduced-motion: reduce) { .np-item.novo-item { animation: none; } }

/* Celular: menos coisa na barra de cima e no cabeçalho (o "Novo" e o "Hoje" já estão na barra de baixo) */
@media (max-width: 991px) {
  .topo-bt[data-act="tema"] { display: none; }
  .page-head .acts > [data-act="novo-pedido"], .page-head .acts > a[href="#hoje"] { display: none; }
  .page-head .acts:not(:has(> :not([data-act="novo-pedido"]):not(a[href="#hoje"]))) { display: none; }
  .passos li { min-width: 62px; }
  .passos button { font-size: 12px; }
  .topo-marca { white-space: nowrap; overflow: hidden; gap: 8px; }
}

/* Faixa de indicadores: em coluna estreita, o ícone sai e o número diminui (nunca corta o valor) */
.kpi-strip > .kpi { container-type: inline-size; }
@container (max-width: 210px) { .kpi-ic { display: none; } .kpi strong { font-size: 22px; } }
/* Quadro de produção: do tablet para cima, colunas de 228 px (cabem as 4); no celular vale a regra de cima (86%: uma coluna por vez) */
@media (min-width: 641px) { .quadro-ped { grid-auto-columns: minmax(228px, 1fr); } }

/* Ajustes > Loja: a barra de salvar fica presa no rodapé e avisa quando há mudanças */
.aj-salvar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin: 18px -22px -22px; padding: 14px 22px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); }
.aj-estado { margin-right: auto; font-size: 13.5px; font-weight: 700; color: var(--ink-3); }
.aj-salvar.sujo { background: var(--warm-50); }
.aj-salvar.sujo .aj-estado { color: var(--rose-600); }
@media (max-width: 991px) { .aj-salvar { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); margin: 18px -16px -16px; padding: 12px 16px; border-radius: var(--r); } }

/* Cardápio: busca em todas as categorias */
.cat-busca { margin-bottom: 12px; max-width: 560px; }
.cat-bar.buscando .chips { opacity: .55; }

/* Revisão (Web Interface Guidelines) */
.side :focus-visible, .nav-mob :focus-visible { outline-color: var(--logo-agua); }   /* o turquesa-escuro some no chocolate */
a, button, summary, label, .chip { touch-action: manipulation; }
.np-sug, .menu-pop { overscroll-behavior: contain; }
.mais-it:hover { background: var(--surface-3); }
.mais-it[aria-current="page"]:hover { background: var(--fita-hover); }
:root:has(.aj-salvar) { scroll-padding-bottom: 96px; }   /* o campo com foco não fica atrás da barra de salvar */
@media (max-width: 991px) { html { scroll-padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); } :root:has(.aj-salvar) { scroll-padding-bottom: 170px; } }
.ic-pin { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; color: var(--gold); }
/* celular: a data vai na primeira linha e o nome e os itens usam a largura toda (vence a regra da lista estreita) */
@media (max-width: 640px) { .ped:has(> .ped-abrir) { grid-template-columns: minmax(0, 1fr) auto; } }
</style>

<script>
  /* Carrega sempre a versão mais nova do backoffice e da API: depois de publicar uma atualização,
     o navegador não reaproveita uma cópia antiga guardada (que deixava opções novas sem aparecer). */
  (() => {
    const v = Date.now(), abs = p => new URL(p, location.href).href;
    const mapa = document.createElement('script');
    mapa.type = 'importmap';
    mapa.textContent = JSON.stringify({ imports: Object.fromEntries(['./avatares.js', '../js/rita-api.js', '../js/calendario.js', '../js/config.js', '../demo/supabase-demo.js', '../demo/dados-demo.js']
      .map(p => [abs(p), abs(p) + '?v=' + v])) });
    document.head.appendChild(mapa);
    const app = document.createElement('script');
    app.type = 'module';
    app.src = 'app.js?v=' + v;
    document.body.appendChild(app);
  })();
</script>
