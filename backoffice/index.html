/* ---------- Novo pedido ---------- */
.np-item { display: grid; grid-template-columns: minmax(0, 2fr) 90px auto; gap: 8px; align-items: end; padding: 14px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 10px; }
.np-item .field { margin: 0; }
.np-concl { padding: 10px 14px; border-radius: var(--r-sm); border: 1px dashed var(--line-2, var(--line)); background: var(--surface-2); margin-bottom: 16px; transition: background .15s, border-color .15s; }
.np-concl.on { border: 1px solid rgba(var(--teal-rgb), .55); background: rgba(var(--teal-rgb), .09); }
.np-concl .chk { align-items: flex-start; }
.np-concl .chk input { margin-top: 2px; }
.np-concl .chk small { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }
.np-concl-op { margin: 8px 0 4px 28px; max-width: 260px; }
.np-concl-op .field { margin: 0; }
.np-item .bolo { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.np-item .obs-l { grid-column: 1 / -1; }
.np-item .sub { grid-column: 1 / -1; text-align: right; font-weight: 600; color: var(--teal); }
.np-item .ed-preco { grid-column: 1 / -1; display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.np-item .ed-preco .field { width: 170px; }
.np-item .ed-preco .sub { font-weight: 500; color: var(--ink-2); padding-bottom: 10px; }
.np-item .ed-preco .sub strong { color: var(--teal); font-weight: 700; }
@media (max-width: 560px) { .np-item .bolo { grid-template-columns: 1fr 1fr; } }
.cols > div > .card + .card { margin-top: 18px; }
.np-total { display: flex; justify-content: space-between; font-family: var(--font-display); font-weight: 700; font-size: 19px; padding: 10px 2px; }

.carregando { display: grid; place-items: center; min-height: 60vh; color: var(--ink-2); font-weight: 500; }
.spin { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--teal-50); border-top-color: var(--teal); animation: gira .8s linear infinite; margin: 0 auto 10px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Tela Hoje (balcão) ---------- */
.hj-top { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.hj-top .busca { flex: 1; }
.hj-top .busca .in { min-height: 50px; font-size: 16px; border-radius: 14px; }
.hj-resumo { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.hj-resumo span { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-weight: 500; font-size: 13px; color: var(--ink-2); box-shadow: var(--shadow-sm); }
.hj-resumo b { color: var(--ink); font-family: var(--font-display); font-size: 15px; }
.hj-atraso { margin: 0 0 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.hj-atraso a { font-weight: 600; }
.hj-lista { display: grid; gap: 10px; }
.hj { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow .14s, border-color .14s; }
.hj.aberto { border-color: rgba(var(--teal-rgb), .55); box-shadow: var(--shadow), 0 0 0 3px rgba(var(--teal-rgb), .12); }
.hj.feito:not(.aberto) { opacity: .72; }
.hj-row { width: 100%; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto 20px; gap: 14px; align-items: center; padding: 13px 18px; min-height: 68px; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; }
.hj-row:hover { background: var(--surface-2); }
.hj-hora { font-family: var(--font-num); font-weight: 600; font-size: 17px; color: var(--teal); line-height: 1.1; }
.hj-hora.sem { font-family: var(--font-ui); font-size: 12px; color: var(--ink-3); }
.hj.feito .hj-hora { color: var(--ink-3); }
.hj-nome { min-width: 0; }
.hj-nome strong { display: block; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hj-nome small { display: block; margin-top: 1px; color: var(--ink-3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hj-pg { display: grid; justify-items: end; gap: 4px; text-align: right; }
.hj-pg .tag .ic { width: 13px; height: 13px; }
.hj-pg .falta { font-weight: 600; font-size: 14px; color: var(--rose-600); white-space: nowrap; }
.hj-pg .falta.zero { color: var(--teal); }
.hj-chev { transform: rotate(180deg); transition: transform .2s; color: var(--ink-3); }
.hj.aberto .hj-chev { transform: rotate(270deg); }
.hj-det { border-top: 1px solid var(--line); padding: 16px 18px; display: grid; gap: 14px; background: var(--surface-2); }
.hj-cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
.hj-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px 16px; }
.hj-box h3 { font-family: var(--font-ui); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin: 0 0 8px; font-weight: 600; }
.hj-it { padding: 8px 0; border-bottom: 1px solid var(--line); }
.hj-it:last-of-type { border-bottom: 0; }
.hj-it .l { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.hj-it .l span { font-weight: 500; white-space: nowrap; }
.hj-it small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.hj-it small.obs { color: var(--ink); }
.hj-nota { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--warm-50); font-size: 13px; }
.hj-nota.fix { background: var(--rose-50); }
.hj-pagto .lin { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; font-size: 14px; }
.hj-pagto .lin b { display: inline-flex; gap: 6px; align-items: center; }
.hj-barra { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin: 8px 0 6px; }
.hj-barra i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.hj-pg-l { display: block; color: var(--ink-2); font-size: 12px; padding: 2px 0; }
.hj-falta-g { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.hj-falta-g.deve { color: var(--rose-600); }
.hj-falta-g.zero { color: var(--teal); }
.hj-falta-g .ic { width: 24px; height: 24px; }
.hj-acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.hj-acoes .retirar { flex: 1 1 260px; min-height: 52px; font-size: 16px; }
.hj-sec { margin: 20px 4px 8px; font-weight: 600; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .12em; }
@media (max-width: 760px) { .hj-cols { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .hj-row { grid-template-columns: 54px minmax(0, 1fr); grid-template-areas: "hora nome" "hora pg"; gap: 4px 10px; padding: 12px 14px; }
  .hj-hora { grid-area: hora; font-size: 15px; }
  .hj-nome { grid-area: nome; }
  .hj-pg { grid-area: pg; display: flex; justify-content: flex-start; align-items: center; gap: 10px; text-align: left; }
  .hj-chev { display: none; }
  .hj-det { padding: 12px 10px; }
  .hj-acoes .btn { flex: 1 1 100%; }
}

/* ---------- Relatório da semana ---------- */
.sem-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sem-rot { min-width: 120px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.sem-rot small { display: block; font-family: var(--font-ui); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); }
.sem-nav [aria-disabled="true"] { opacity: .35; pointer-events: none; }
.kpi .delta { font-size: 12px; font-weight: 600; white-space: nowrap; }
.delta.bom { color: var(--teal); } .delta.ruim { color: var(--rose-600); } .delta.neutro { color: var(--ink-3); font-weight: 500; }
.delta small { font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.delta.claro, .delta.claro small { color: #fff; }
.sem-din { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 4px 0 14px; }
.sem-din span { display: block; font-size: 12.5px; color: var(--ink-3); }
.sem-din strong { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
/* colunas por dia */
.g-colunas { padding: 4px 0 0; }
.g-area { position: relative; height: 230px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end; padding-left: 64px; }
.g-linha { position: absolute; left: 64px; right: 0; height: 0; border-top: 1px solid var(--line); }
.g-linha span { position: absolute; right: calc(100% + 10px); top: -8px; font-family: var(--font-num); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.g-col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; z-index: 1; cursor: default; }
.g-barra { width: min(46px, 70%); border-radius: 6px 6px 0 0; background: rgba(var(--grafico-rgb), .38); transition: background .14s; }
.g-col.top .g-barra { background: var(--grafico); }
.g-col:hover .g-barra { background: rgba(var(--grafico-rgb), .6); }
.g-col.top:hover .g-barra { background: var(--grafico); filter: brightness(1.08); }
.g-val { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.g-col.top .g-val { color: var(--ink); font-weight: 700; }
.g-eixo { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; padding: 10px 0 0 64px; border-top: 1px solid var(--line-2); margin-top: -1px; }
.g-eixo span { text-align: center; font-family: var(--font-num); font-size: 11px; color: var(--ink-3); }
.g-eixo b { display: block; font-family: var(--font-ui); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
/* barras horizontais */
.g-barras { display: grid; gap: 14px; }
.gb-txt { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; margin-bottom: 6px; }
.gb-txt span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gb-txt b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.gb-trilho { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.gb-trilho i { display: block; height: 100%; border-radius: 999px; background: var(--grafico); }
.gb-linha small { display: block; font-size: 12px; color: var(--ink-3); margin-top: 4px; }
/* tabela dia a dia */
.sem-tab-wrap { overflow-x: auto; }
.sem-tab { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 12px; }
.sem-tab th, .sem-tab td { padding: 11px 22px; text-align: right; border-top: 1px solid var(--line); }
.sem-tab th:first-child { text-align: left; font-weight: 500; }
.sem-tab tbody th { text-transform: capitalize; }
.sem-tab thead th { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); border-top: 0; }
.sem-tab tbody tr:hover { background: var(--surface-2); }
.sem-tab tr.top th, .sem-tab tr.top td { color: var(--teal); font-weight: 700; }
.sem-tab tfoot th, .sem-tab tfoot td { font-weight: 700; border-top: 1px solid var(--line-2); }
@media (max-width: 640px) {
  .g-area, .g-eixo { padding-left: 0; gap: 4px; }
  .g-linha { left: 0; } .g-linha span { display: none; }
  .g-val { font-size: 10px; writing-mode: vertical-rl; transform: rotate(180deg); }
  .g-area { height: 200px; }
  .sem-tab th, .sem-tab td { padding: 10px 14px; }
  .sem-din strong { font-size: 21px; }
}

/* ---------- Prejuízos ---------- */
.prej-tab td:nth-child(2) { white-space: nowrap; }
.prej-tab td small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.prej-tab td, .prej-tab th { text-align: left; vertical-align: top; }
.prej-tab td.num, .prej-tab th:nth-child(n+5) { text-align: right; white-space: nowrap; }
.prj-resultados { display: grid; gap: 6px; margin-top: 12px; max-height: 340px; overflow-y: auto; }
.prj-res { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 11px 13px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: inherit; cursor: pointer; }
.prj-res:hover { background: var(--surface-2); border-color: var(--line-2); }
.prj-res span { min-width: 0; }
.prj-res strong { display: block; }
.prj-res small { display: block; color: var(--ink-3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prj-ped { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); margin-bottom: 14px; }
.prj-ped strong { display: block; font-size: 15px; }
.prj-ped small { color: var(--ink-3); font-size: 12.5px; }
.prj-itens { display: grid; gap: 8px; }
.prj-it { display: grid; grid-template-columns: minmax(0, 1fr) auto 170px; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.prj-it-t small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.prj-it-q { display: flex; align-items: center; gap: 4px; }
.prj-it-q .in { width: 62px; text-align: center; font-weight: 700; padding-left: 6px; padding-right: 6px; }
.prj-it-v .field { margin: 0; }
.prj-it-v .field > label { font-size: 12px; }
.prj-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--rose-50); }
.prj-total strong { font-family: var(--font-display); font-size: 22px; color: var(--rose-600); }
@media (max-width: 640px) {
  .prej-tab thead { display: none; }
  .prej-tab, .prej-tab tbody, .prej-tab tfoot { display: block; width: 100%; }
  .prej-tab tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
  .prej-tab tbody td { display: block; padding: 0; border: 0; text-align: left !important; white-space: normal !important; }
  .prej-tab tbody td:nth-child(1) { grid-column: 1; grid-row: 1; color: var(--ink-3); font-size: 12.5px; }
  .prej-tab tbody td:nth-child(2) { grid-column: 1; grid-row: 2; }
  .prej-tab tbody td:nth-child(3) { grid-column: 1 / -1; grid-row: 3; font-weight: 600; }
  .prej-tab tbody td:nth-child(4) { grid-column: 1; grid-row: 4; }
  .prej-tab tbody td:nth-child(5) { grid-column: 2; grid-row: 2; text-align: right !important; color: var(--ink-3); font-size: 12.5px; }
  .prej-tab tbody td:nth-child(6) { grid-column: 2; grid-row: 1; text-align: right !important; }
  .prej-tab tbody td:nth-child(7) { grid-column: 2; grid-row: 4; justify-self: end; }
  .prej-tab td:nth-child(2) small { display: inline; margin-left: 6px; }
  .prej-tab tfoot tr { display: flex; justify-content: space-between; padding: 12px 16px; }
  .prej-tab tfoot th, .prej-tab tfoot td { padding: 0; border: 0; }
  .prej-tab tfoot td:empty { display: none; }
  .kpi strong { font-size: 19px; }
  .kpi .delta { white-space: normal; }
}
@media (max-width: 640px) { .prj-it { grid-template-columns: minmax(0, 1fr) auto; } .prj-it-v { grid-column: 1 / -1; } }

<script>
  /* Carrega sempre a versão mais nova do backoffice e da API: depois de publicar uma atualização,

  (() => {

    const mapa = document.createElement('script');
    mapa.type = 'importmap';
    mapa.textContent = JSON.stringify({ imports: Object.fromEntries(['./avatares.js', '../js/rita-api.js', '../js/config.js', '../demo/supabase-demo.js', '../demo/dados-demo.js']
      .map(p => [abs(p), abs(p) + '?v=' + v])) });
    document.head.appendChild(mapa);
    const app = document.createElement('script');
    app.type = 'module';
    app.src = 'app.js?v=' + v;
    document.body.appendChild(app);
  })();
</script>
