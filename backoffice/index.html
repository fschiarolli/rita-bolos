<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
  /* O endereço precisa terminar com barra (/backoffice/); sem ela o navegador procura os arquivos no lugar errado. */
  if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF4EC">
<title>Backoffice — Rita Bolos</title>
<!-- app instalável no celular e no computador (manifest.webmanifest + sw.js, registrado no app.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/favicon.ico" sizes="32x32">
<link rel="icon" href="icones/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">

<script>
  /* Tema escolhido pela pessoa (claro, escuro ou Drácula); sem escolha, segue o sistema. Aplicado antes de desenhar para não piscar. */
  try { var t = { claro: 'light', escuro: 'dark', dracula: 'dracula' }[localStorage.getItem('ritabolos.tema')]; if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
/*
  Backoffice V2 — identidade do logo da Rita Bolos.
  Cores tiradas do próprio logo: o chocolate do bolo e das letras, a fita turquesa, o verde-água da borda,
  o pêssego do selo e o caramelo da massa. As fontes são as do site do cliente (DM Serif Display nos títulos,
  Nunito no resto), para o sistema e o site falarem a mesma língua.
  Um destaque só: a fita turquesa marca onde você está e o próximo passo do pedido.
  Os nomes das variáveis antigas (--ink, --teal, --rose-600...) foram mantidos: o app.js usa várias em estilos inline.
  --rose-* agora é o "atenção" (hoje, falta pagar, sinal pendente) em caramelo queimado; o rosa saiu porque não está no logo.
*/
:root {
  /* cores do logo (primitivas) */
  --logo-chocolate: #58210F; --logo-fita: #51AB9D; --logo-agua: #A1DFD0; --logo-pessego: #F5D4AA; --logo-caramelo: #B37951; --logo-petroleo: #104744;

  --font-ui: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'DM Serif Display', Georgia, 'Times New Roman', serif;
  --font-num: var(--font-ui);   /* a Nunito já tem números de largura fixa: nada de fonte de terminal */
  --font-head: var(--font-ui);  /* títulos de cartão e números grandes: Nunito em negrito; a serifada fica para títulos de tela e a marca */
  --bg: #FBF4EC; --surface: #FFFFFF; --surface-2: #F6EBDD; --surface-3: #EEDCC6; --glass: #FBF4EC;
  --ink: #2E1308; --ink-2: #5C3A28; --ink-3: #7A5A47; --line: rgba(88, 33, 15, .12); --line-2: rgba(88, 33, 15, .22);
  --primary: #58210F; --on-primary: #FFF4E6; --primary-hover: #6E2E17; --primary-rgb: 88, 33, 15;
  --teal: #1F6E63; --on-teal: #FFFFFF; --teal-rgb: 31, 110, 99; --teal-50: #E2F3EE; --mint: #A1DFD0;
  --fita: #51AB9D; --on-fita: #2E1308; --fita-hover: #5DB8AA;   /* a fita do logo: o próximo passo e onde você está */
  --rose: #F5D4AA; --rose-600: #9C4A20; --rose-50: #FBE7D3; --rose-rgb: 156, 74, 32;   /* atenção: caramelo queimado */
  --warm-50: #FCEBD6; --gold: #8A6418; --gold-rgb: 138, 100, 24;
  --error: #B3261E; --error-50: #FCE8E6;
  --ent: #2F6A9A; --ent-50: #E6EFF7; --ent-rgb: 47, 106, 154;   /* entregas (status "Saiu para entrega") */
  --focus: #1F6E63;
  --accent-wash: rgba(81, 171, 157, .14);
  --destaque-a: #58210F; --destaque-b: #58210F;   /* cartão preenchido: o chocolate do logo, chapado */
  --destaque-sombra: transparent;
  --grafico: var(--teal); --grafico-rgb: var(--teal-rgb);   /* barras dos gráficos do relatório */
  /* fatias e séries dos gráficos do Painel, nas cores do logo (a 5ª é "Outras") */
  --g1: #1F6E63; --g2: #51AB9D; --g3: #B37951; --g4: #58210F; --g5: #E8C9A0; --serie-a: #1F6E63; --serie-b: #B37951;
  --hero-brilho: transparent;
  --dot-filter: none;
  /* menu lateral: o chocolate do bolo, com a fita turquesa no item aberto */
  --side-bg: #4A1C0C; --side-ink: #F9E5CF; --side-ink-2: #D9B99C; --side-hover: rgba(245, 212, 170, .10); --side-line: rgba(245, 212, 170, .14);
  --shadow-sm: 0 1px 2px rgba(88, 33, 15, .06);
  --shadow: 0 1px 2px rgba(88, 33, 15, .05);
  --shadow-lg: 0 22px 50px -18px rgba(46, 19, 8, .38), 0 6px 16px -8px rgba(46, 19, 8, .16);   /* só o que flutua */
  --glow: none;
  --glow-teal: none;
  --r-xs: 8px; --r-sm: 12px; --r: 18px; --r-xl: 24px;
  --side: 256px; --topbar: 64px;
  --ease: cubic-bezier(.2, 0, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #1A0D07; --surface: #24130B; --surface-2: #2F1A10; --surface-3: #3B2216; --glass: #1A0D07;
    --ink: #FBEBD8; --ink-2: #E2C6AA; --ink-3: #B9987D; --line: rgba(251, 235, 216, .09); --line-2: rgba(251, 235, 216, .17);
    --primary: #F5D4AA; --on-primary: #2E1308; --primary-hover: #FBE1BF; --primary-rgb: 245, 212, 170;
    --teal: #8DD9C9; --on-teal: #0D2E2B; --teal-rgb: 141, 217, 201; --teal-50: rgba(141, 217, 201, .13);
    --fita: #51AB9D; --on-fita: #1A0D07; --fita-hover: #63BCAE;
    --rose: #F5D4AA; --rose-600: #F0A877; --rose-50: rgba(240, 168, 119, .14); --rose-rgb: 240, 168, 119;
    --warm-50: rgba(245, 212, 170, .10); --gold: #E2C27A; --gold-rgb: 226, 194, 122;
    --error: #FF9C94; --error-50: rgba(255, 120, 110, .14);
    --ent: #9CC4E8; --ent-50: rgba(120, 170, 220, .14); --ent-rgb: 156, 196, 232;
    --focus: #8DD9C9;
    --accent-wash: rgba(81, 171, 157, .18);
    --destaque-a: #3B2216; --destaque-b: #3B2216;
    --g1: #A1DFD0; --g2: #51AB9D; --g3: #F5D4AA; --g4: #B37951; --g5: #6E4B3A; --serie-a: #A1DFD0; --serie-b: #F5D4AA;
    --side-bg: #120804; --side-ink: #F9E5CF; --side-ink-2: #C8A88C; --side-hover: rgba(245, 212, 170, .08); --side-line: rgba(245, 212, 170, .10);
    --dot-filter: brightness(1.55) saturate(1.1);
    --shadow-sm: none; --shadow: none;
    --shadow-lg: 0 22px 50px -14px rgba(0, 0, 0, .75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A0D07; --surface: #24130B; --surface-2: #2F1A10; --surface-3: #3B2216; --glass: #1A0D07;
  --ink: #FBEBD8; --ink-2: #E2C6AA; --ink-3: #B9987D; --line: rgba(251, 235, 216, .09); --line-2: rgba(251, 235, 216, .17);
  --primary: #F5D4AA; --on-primary: #2E1308; --primary-hover: #FBE1BF; --primary-rgb: 245, 212, 170;
  --teal: #8DD9C9; --on-teal: #0D2E2B; --teal-rgb: 141, 217, 201; --teal-50: rgba(141, 217, 201, .13);
  --fita: #51AB9D; --on-fita: #1A0D07; --fita-hover: #63BCAE;
  --rose: #F5D4AA; --rose-600: #F0A877; --rose-50: rgba(240, 168, 119, .14); --rose-rgb: 240, 168, 119;
  --warm-50: rgba(245, 212, 170, .10); --gold: #E2C27A; --gold-rgb: 226, 194, 122;
  --error: #FF9C94; --error-50: rgba(255, 120, 110, .14);
  --ent: #9CC4E8; --ent-50: rgba(120, 170, 220, .14); --ent-rgb: 156, 196, 232;
  --focus: #8DD9C9;
  --accent-wash: rgba(81, 171, 157, .18);
  --destaque-a: #3B2216; --destaque-b: #3B2216;
  --g1: #A1DFD0; --g2: #51AB9D; --g3: #F5D4AA; --g4: #B37951; --g5: #6E4B3A; --serie-a: #A1DFD0; --serie-b: #F5D4AA;
  --side-bg: #120804; --side-ink: #F9E5CF; --side-ink-2: #C8A88C; --side-hover: rgba(245, 212, 170, .08); --side-line: rgba(245, 212, 170, .10);
  --dot-filter: brightness(1.55) saturate(1.1);
  --shadow-sm: none; --shadow: none;
  --shadow-lg: 0 22px 50px -14px rgba(0, 0, 0, .75);
  color-scheme: dark;
}
/* Tema Drácula (escolhido em Minha conta > Tema): a paleta de draculatheme.com nos mesmos papéis do tema escuro.
   Roxo: a ação principal; rosa: onde você está e o próximo passo; verde: o que está certo (pago, ok); ciano: entregas;
   amarelo: as estrelas; laranja: atenção; vermelho: erro. O "comentário" (#6272A4) foi clareado para o texto
   secundário passar de 4,5:1 sobre os cartões. */
:root[data-theme="dracula"] {
  --dr-fundo: #282A36; --dr-linha: #44475A; --dr-texto: #F8F8F2; --dr-comentario: #6272A4;
  --dr-ciano: #8BE9FD; --dr-verde: #50FA7B; --dr-laranja: #FFB86C; --dr-rosa: #FF79C6; --dr-roxo: #BD93F9; --dr-vermelho: #FF5555; --dr-amarelo: #F1FA8C;
  --bg: #21222C; --surface: var(--dr-fundo); --surface-2: #343746; --surface-3: var(--dr-linha); --glass: #21222C;
  --ink: var(--dr-texto); --ink-2: #D6D7E6; --ink-3: #A3A9CF; --line: rgba(248, 248, 242, .09); --line-2: rgba(248, 248, 242, .17);
  --primary: var(--dr-roxo); --on-primary: #21222C; --primary-hover: #CBA8FA; --primary-rgb: 189, 147, 249;
  --teal: var(--dr-verde); --on-teal: #21222C; --teal-rgb: 80, 250, 123; --teal-50: rgba(80, 250, 123, .12); --mint: var(--dr-ciano);
  --fita: var(--dr-rosa); --on-fita: #21222C; --fita-hover: #FF92D0;
  --rose: var(--dr-laranja); --rose-600: var(--dr-laranja); --rose-50: rgba(255, 184, 108, .14); --rose-rgb: 255, 184, 108;
  --warm-50: rgba(241, 250, 140, .08); --gold: var(--dr-amarelo); --gold-rgb: 241, 250, 140;
  --error: var(--dr-vermelho); --error-50: rgba(255, 85, 85, .15);
  --ent: var(--dr-ciano); --ent-50: rgba(139, 233, 253, .13); --ent-rgb: 139, 233, 253;
  --focus: var(--dr-rosa);
  --accent-wash: rgba(189, 147, 249, .16);
  --destaque-a: #343746; --destaque-b: #343746;
  --g1: var(--dr-verde); --g2: var(--dr-rosa); --g3: var(--dr-laranja); --g4: var(--dr-roxo); --g5: var(--dr-comentario); --serie-a: var(--dr-ciano); --serie-b: var(--dr-laranja);
  --side-bg: #191A21; --side-ink: var(--dr-texto); --side-ink-2: #A3A9CF; --side-hover: rgba(189, 147, 249, .12); --side-line: rgba(248, 248, 242, .08);
  --dot-filter: brightness(1.55) saturate(1.1);
  --shadow-sm: none; --shadow: none;
  --shadow-lg: 0 22px 50px -14px rgba(0, 0, 0, .75);
  color-scheme: dark;
}
/* texto branco sobre o que no Drácula fica claro (verde, laranja, ciano): escuro, para ler */
:root[data-theme="dracula"] .av-lapis, :root[data-theme="dracula"] .topo-badge, :root[data-theme="dracula"] .vista-sel .vs-n,
:root[data-theme="dracula"] .ped-acao.ent:hover { color: #21222C; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: calc(var(--topbar) + 12px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body { font-family: var(--font-ui); color: var(--ink); background: var(--bg); font-size: 14.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100dvh; font-weight: 400; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal); }
[hidden] { display: none !important; }
::selection { background: rgba(var(--teal-rgb), .25); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; }
strong, b { font-weight: 600; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: -.005em; }
.eyebrow { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

/* ---------- Botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid transparent; background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .14s var(--ease), box-shadow .14s var(--ease), transform .1s, border-color .14s; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--glow); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.teal { background: var(--fita); color: var(--on-fita); font-weight: 800; }
.btn.teal:hover { background: var(--fita-hover); }
.btn.wa { background: #1F8F55; color: #fff; }
.btn.ghost { background: transparent; border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--line-2); }
.btn.danger { background: var(--error-50); color: var(--error); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.icon { width: 40px; padding: 0; }
.btn.icon.sm { width: 34px; }
.btn.block { width: 100%; }
.btn[aria-busy="true"] { pointer-events: none; }
.btn[aria-busy="true"]::before { content: ''; width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: gira .7s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (pointer: coarse) { .btn { min-height: 44px; } .btn.sm { min-height: 38px; } .btn.icon { width: 44px; } .btn.icon.sm { width: 38px; } }
.link { background: none; border: 0; padding: 4px 0; color: var(--teal); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Campos ---------- */
.field { display: grid; gap: 6px; margin-bottom: 14px; align-content: start; }   /* lado a lado com um campo que tem dica: não estica */
.field > label, .field > .lbl { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.field .dica { font-size: 12.5px; color: var(--ink-3); margin: 0; }
.in, .sel, .ta { width: 100%; min-height: 42px; padding: 9px 13px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); font-size: 14.5px; font-weight: 400; transition: border-color .14s, box-shadow .14s; }
.in::placeholder, .ta::placeholder { color: var(--ink-3); opacity: .85; }
.ta { min-height: 84px; resize: vertical; line-height: 1.45; }
.in:hover, .sel:hover, .ta:hover { border-color: rgba(var(--teal-rgb), .45); }
.in:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(var(--teal-rgb), .16); }
.in[aria-invalid="true"] { border-color: var(--error); }
.in:disabled, .sel:disabled, .ta:disabled { opacity: .6; cursor: not-allowed; border-color: var(--line-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.chk { display: flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 500; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--teal); flex: none; }
.switch { appearance: none; -webkit-appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line-2); position: relative; cursor: pointer; flex: none; transition: background .14s; margin: 0; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .18s var(--ease); }
.switch:checked { background: var(--teal); border-color: transparent; }
.switch:checked::after { transform: translateX(18px); }
.money { position: relative; }
.money .in { padding-left: 38px; }
.money::before { content: 'R$'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-weight: 500; color: var(--ink-3); font-size: 13.5px; pointer-events: none; }
.err-msg { color: var(--error); font-weight: 500; font-size: 13.5px; }

/* ---------- Login ---------- */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--bg); }
.login-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 34px 30px 30px; box-shadow: var(--shadow); text-align: center; }
.login-card img { width: 104px; height: auto; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .18)); }
.login-card h1 { font-family: var(--font-display); font-size: 28px; font-weight: 400; letter-spacing: -.005em; margin: 10px 0 2px; color: var(--ink); }
.login-card p.sub { margin: 0 0 24px; color: var(--ink-3); font-weight: 700; font-size: 14px; }
.login-card form { text-align: left; }
.login-card form .btn.block { margin-top: 4px; min-height: 44px; }
.demo-note { margin-top: 18px; padding: 11px 13px; border-radius: var(--r-sm); background: var(--warm-50); font-size: 13px; color: var(--ink-2); text-align: left; }

/* ---------- Estrutura: sidebar + barra superior ---------- */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--side-bg); color: var(--side-ink); z-index: 35; }
.brand { display: flex; align-items: center; gap: 11px; height: var(--topbar); padding: 0 20px; text-decoration: none; color: inherit; flex: none; }
.brand img { width: 38px; height: 38px; object-fit: contain; }
.brand strong { font-family: var(--font-display); font-weight: 400; font-size: 21px; letter-spacing: -.005em; color: var(--side-ink); display: block; line-height: 1.1; }
.brand span { display: block; font-size: 12.5px; font-weight: 700; color: var(--side-ink-2); margin-top: 1px; }
.side-nav { flex: 1; overflow-y: auto; padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 2px; scrollbar-color: var(--side-line) transparent; }
.side-sec { margin: 18px 12px 6px; font-size: 12.5px; font-weight: 700; color: var(--side-ink-2); }
.side-sec:first-child { margin-top: 10px; }
.nav-a { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 12px; border-radius: 12px; color: var(--side-ink-2); font-weight: 700; font-size: 14.5px; text-decoration: none; position: relative; transition: background .14s, color .14s; }
.nav-a .ic { width: 19px; height: 19px; }
.nav-a:hover { background: var(--side-hover); color: var(--side-ink); }
.nav-a:focus-visible { outline-color: var(--logo-agua); }
/* onde você está: a fita turquesa do logo, que vai até a borda e termina recortada, como a ponta da fita */
.nav-a[aria-current="page"] { background: var(--fita); color: var(--on-fita); margin-right: -14px; padding-right: 26px; border-radius: 12px 0 0 12px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 50%, 100% 100%, 0 100%); }
.nav-a[aria-current="page"] .ic { color: var(--on-fita); }
.nav-a .ext { margin-left: auto; width: 14px; height: 14px; opacity: .55; }
.nav-badge { margin-left: auto; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--logo-pessego); color: #2E1308; font-size: 12px; font-weight: 800; display: inline-grid; place-items: center; }
.nav-a[aria-current="page"] .nav-badge { background: rgba(46, 19, 8, .16); color: var(--on-fita); }

.user-card { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; color: var(--side-ink); }

/* Minha conta: o avatar é o botão para trocar */

.av-lapis .ic { width: 12px; height: 12px; }
/* Escolha do avatar */
.av-topo { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.av-topo .avatar { width: 64px; height: 64px; font-size: 22px; }
.av-topo strong { display: block; font-size: 16px; }
.av-topo small { display: block; font-size: 13px; color: var(--ink-3); }
.av-grade { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 860px) { .av-grade { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.av-op { aspect-ratio: 1; border-radius: 18px; overflow: hidden; padding: 0; cursor: pointer; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); transition: transform .12s, box-shadow .12s; }
.av-op svg { width: 100%; height: 100%; display: block; }
.av-op:hover { transform: translateY(-2px); }
.av-op[aria-checked="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--teal); }
@media (max-width: 560px) { .av-grade { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } }

.coluna { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.topo { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: var(--topbar); padding: 0 28px; background: var(--bg); border-bottom: 1px solid var(--line); }
.topo-marca { display: none; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: -.005em; }

.topo-busca { position: relative; flex: 0 1 420px; }
.topo-busca .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 17px; height: 17px; }
.topo-busca input { width: 100%; height: 40px; padding: 0 44px 0 40px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); font-size: 14px; }

.topo-busca input::placeholder { color: var(--ink-3); }
.topo-busca kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); min-width: 24px; height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-3); font-family: var(--font-num); font-size: 11.5px; display: grid; place-items: center; }

.topo-bt .ic { width: 19px; height: 19px; }

/* Escolha do tema: menu do botão da barra superior e grade em Minha conta */
.tema-menu { position: fixed; z-index: 90; width: min(268px, calc(100vw - 16px)); padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); animation: temaEntra .14s var(--ease); }
@keyframes temaEntra { from { opacity: 0; transform: translateY(-4px); } }

.tema-menu button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; color: var(--ink); }

.tema-amostra { position: relative; width: 46px; height: 34px; flex: none; border-radius: 9px; overflow: hidden; background: var(--a); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.tema-amostra::before { content: ""; position: absolute; inset: 7px 6px; border-radius: 5px; background: var(--b); box-shadow: 0 1px 3px rgba(0, 0, 0, .16); }
.tema-amostra::after { content: ""; position: absolute; left: 11px; top: 12px; width: 18px; height: 3.5px; border-radius: 3px; background: var(--c); box-shadow: 0 6px 0 var(--d); }
.tema-amostra.auto { background: linear-gradient(135deg, #FBF4EC 0 50%, #1A0D07 50% 100%); }   /* amostra metade clara, metade escura (não é enfeite) */
.tema-amostra.auto::before { inset: 7px 6px; background: linear-gradient(135deg, #FFFFFF 0 50%, #24130B 50% 100%); }
.tema-amostra.auto::after { background: linear-gradient(90deg, #58210F 0 50%, #F5D4AA 50% 100%); box-shadow: 0 6px 0 #51AB9D; }
.tema-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }

.tema-op:hover { background: var(--surface-2); }
.tema-op[aria-checked="true"] { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(var(--teal-rgb), .35); color: var(--ink); }

@media (max-width: 400px) { .tema-grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.topo-av { border: 0; background: none; padding: 2px; margin-left: 4px; cursor: pointer; border-radius: 50%; }
.nav-mob { display: none; }
.so-cel { display: none !important; }
main.conteudo { padding: 28px 32px 48px; min-width: 0; max-width: 1240px; width: 100%; flex: 1; }
.rodape { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 32px 22px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }

.rodape a:hover { color: var(--ink); }
.rodape .ver { font-family: var(--font-num); font-size: 11.5px; margin-left: 8px; opacity: .8; }

/* Cabeçalho das telas: trilha, título, subtítulo e ações */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px 18px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head .trilha { display: none; }
.ph-txt { min-width: 0; }
.trilha { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 13px; color: var(--ink-3); }
.trilha a { color: var(--ink-3); display: inline-grid; place-items: center; text-decoration: none; }
.trilha a:hover { color: var(--ink); }
.trilha .ic { width: 15px; height: 15px; }
.trilha .sep { width: 12px; height: 12px; opacity: .6; }
.trilha span { color: var(--ink); font-weight: 500; }
.page-head h1 { font-family: var(--font-display); font-weight: 400; font-size: 38px; letter-spacing: -.005em; line-height: 1.05; color: var(--logo-chocolate); text-wrap: balance; }
:root[data-theme="dark"] .page-head h1, :root[data-theme="dracula"] .page-head h1 { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .page-head h1 { color: var(--ink); } }
.ph-sub { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.page-head .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

@media (max-width: 991px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topo { padding: 0 14px; gap: 8px; height: 58px; }
  .topo-marca { display: flex; flex: 1; min-width: 0; }
  .topo-busca { display: none; }
  .topo-bt[data-tv] { display: none; }
  /* barra de baixo: o chocolate do menu, 5 lugares, e o "Novo" no meio, como a sacola do site */
  .nav-mob { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--side-bg); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .nav-mob > a, .nav-mob > button { display: grid; justify-items: center; gap: 3px; padding: 6px 2px 4px; border: 0; background: none; border-radius: 12px; font: inherit; font-size: 12px; font-weight: 700; color: var(--side-ink-2); text-decoration: none; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .nav-mob > a .ic, .nav-mob > button > .ic { width: 22px; height: 22px; position: relative; z-index: 1; }
  .nav-mob > a::before, .nav-mob > .nav-mais::before { content: ''; position: absolute; top: 3px; left: 50%; width: 54px; height: 30px; margin-left: -27px; border-radius: 999px; background: transparent; transition: background .16s var(--ease); }
  .nav-mob > a[aria-current="page"], .nav-mob > .nav-mais.atual { color: var(--side-ink); }
  .nav-mob > a[aria-current="page"]::before, .nav-mob > .nav-mais.atual::before { background: var(--fita); }
  .nav-mob > a[aria-current="page"] .ic, .nav-mob > .nav-mais.atual > .ic { color: var(--on-fita); }
  .nav-mob .nav-badge { position: absolute; z-index: 2; top: 0; left: calc(50% + 6px); margin: 0; min-width: 18px; height: 18px; font-size: 11px; padding: 0 5px; }
  .nav-mob .nav-ponto { position: absolute; z-index: 2; top: 4px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--logo-pessego); box-shadow: 0 0 0 2px var(--side-bg); }
  .nav-novo { color: var(--side-ink) !important; }
  .nav-novo .nn-c { width: 54px; height: 54px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center; background: var(--fita); color: var(--on-fita); box-shadow: 0 0 0 6px var(--side-bg); transition: transform .12s var(--ease); }
  .nav-novo .nn-c .ic { width: 26px; height: 26px; stroke-width: 2.4; }
  .nav-novo:active .nn-c { transform: scale(.94); }
  .so-cel { display: grid !important; }
  /* busca no celular: o campo cobre a barra de cima enquanto você procura */
  .topo.buscando .topo-busca { display: block; position: absolute; left: 10px; right: 10px; top: 50%; transform: translateY(-50%); z-index: 3; flex: none; }
  .topo.buscando .topo-busca kbd { display: none; }
  main.conteudo { padding: 20px 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .rodape { display: none; }
  .page-head { margin-bottom: 18px; align-items: flex-start; }
  .page-head h1 { font-size: 26px; }
  .ph-sub { font-size: 14px; }
  .trilha { display: none; }
}

/* ---------- Cartões ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.card + .card { margin-top: 18px; }
.hero-grid > .card + .card, .cols > .card + .card { margin-top: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-h h2 { font-family: var(--font-head); font-weight: 800; font-size: 19px; letter-spacing: -.015em; }
.card-h .eyebrow { margin-bottom: 4px; }
@media (max-width: 640px) { .card { padding: 16px; } .card + .card { margin-top: 14px; } }

/* Painel: cartão de boas-vindas + cartão preenchido + faixa de indicadores */
.hero-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: center; padding: 26px 26px 24px; }

.hero-t { font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: -.005em; line-height: 1.15; }
.hero-txt { margin: 8px 0 18px; color: var(--ink-2); font-size: 14.5px; max-width: 52ch; }
.hero-txt b { color: var(--ink); }
.hero-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-stats { display: grid; grid-auto-flow: column; gap: 22px; position: relative; z-index: 1; }
.hero-stats a { text-decoration: none; color: inherit; display: grid; gap: 4px; }
.hero-stats span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.hero-stats strong { font-family: var(--font-head); font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.hero-stats a:hover strong { color: var(--teal); }
.destaque-card { position: relative; overflow: hidden; border: 0; color: #FFF4E6; background: var(--destaque-a); box-shadow: none; display: flex; flex-direction: column; padding: 24px; }
.destaque-card .eyebrow { color: var(--logo-pessego); }
.destaque-card .dc-val { font-family: var(--font-display); font-size: 36px; font-weight: 400; letter-spacing: -.005em; line-height: 1.05; }
.destaque-card .dc-chip { align-self: flex-start; margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .16); font-size: 12.5px; font-weight: 600; }
.destaque-card p { margin: 14px 0 16px; font-size: 13.5px; color: rgba(255, 255, 255, .82); max-width: 34ch; }
.destaque-card .btn { margin-top: auto; align-self: flex-start; background: rgba(255, 255, 255, .14); color: #fff; border-color: rgba(255, 255, 255, .28); }
.destaque-card .btn:hover { background: rgba(255, 255, 255, .24); }
.destaque-card .dc-art { display: none; }
.kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); padding: 0; margin-bottom: 18px; overflow: hidden; }   /* com "Saiu para entrega", cabem 6 numa linha */
.kpi { display: flex; align-items: center; gap: 14px; padding: 20px 22px; text-decoration: none; color: inherit; border-left: 1px solid var(--line); transition: background .14s; min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi:hover { background: var(--surface-2); }
.kpi-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: rgba(var(--c-rgb, 43, 116, 101), .14); color: var(--c, var(--teal)); }
.kpi-ic .ic { width: 20px; height: 20px; filter: var(--dot-filter); }
.kpi-t { min-width: 0; display: grid; gap: 2px; }
.kpi span { font-size: 13px; font-weight: 600; color: var(--ink-3); line-height: 1.25; }
.kpi strong { white-space: nowrap; }
.kpi strong { font-family: var(--font-head); font-size: 26px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
@media (max-width: 1150px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } .hero { grid-template-columns: minmax(0, 1fr); } .hero-stats { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } }
@media (max-width: 640px) {
  .hero { padding: 20px; } .hero-t { font-size: 25px; } .hero-stats strong { font-size: 25px; }
  .kpi-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-left: 0; border-top: 1px solid var(--line); padding: 16px; gap: 11px; }
  .kpi:nth-child(-n+2) { border-top: 0; }
  .kpi:nth-child(even) { border-left: 1px solid var(--line); }
  .kpi-ic { width: 38px; height: 38px; }
  .kpi strong { font-size: 22px; }
  .kpi span { white-space: normal; }
}
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }

/* Painel: os gráficos dos últimos 28 dias (área, rosca, linha, colunas e os mais vendidos) */
.pn-grade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(300px, .82fr); grid-template-areas: "area area rosca" "linha barras top"; gap: 18px; margin-bottom: 18px; }
.pn-grade > .card { margin: 0; display: flex; flex-direction: column; min-width: 0; }
.pn-area { grid-area: area; } .pn-rosca { grid-area: rosca; } .pn-linha { grid-area: linha; } .pn-barras { grid-area: barras; } .pn-top { grid-area: top; }
.pn-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.pn-h h2 { font-family: var(--font-head); font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.pn-h p { margin: 3px 0 0; font-size: 13px; color: var(--ink-3); }
.pn-h > a { font-size: 13px; font-weight: 700; color: var(--teal); white-space: nowrap; margin-top: 2px; }
.pn-num { display: grid; justify-items: end; gap: 3px; text-align: right; }
.pn-num strong { font-family: var(--font-head); font-weight: 800; font-size: 26px; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pn-num .delta { font-size: 12.5px; white-space: nowrap; }

.ga { flex: 1; display: flex; flex-direction: column; min-height: 260px; padding-left: 54px; border-radius: var(--r-xs); }
.ga-plot { position: relative; flex: 1; min-height: 200px; margin-top: 34px; touch-action: pan-y; }
.ga-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ga-grade { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line-2); }
.ga-grade span { position: absolute; right: calc(100% + 10px); top: -.75em; font-size: 12px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ga-fundo { fill: rgba(var(--grafico-rgb), .13); }
.ga-linha { fill: none; stroke: var(--grafico); stroke-width: 2.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.ga-mira { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line-2); pointer-events: none; }
.ga-ponto { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--surface); border: 3px solid var(--grafico); pointer-events: none; }
.ga-dica { position: absolute; z-index: 1; display: grid; gap: 1px; padding: 7px 11px; border-radius: 10px; background: var(--ink); color: var(--surface); font-size: 12px; white-space: nowrap; pointer-events: none;
  transform: translate(var(--tx, -50%), var(--ty, calc(-100% - 16px))); }
.ga-dica b { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ga-dica.esq { --tx: calc(-100% + 18px); } .ga-dica.dir { --tx: -18px; } .ga-dica.baixo { --ty: 16px; }
.ga-x { position: relative; height: 18px; margin-top: 10px; }
.ga-x span { position: absolute; transform: translateX(-50%); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.ga-x span:first-child { transform: none; } .ga-x span:last-child { transform: translateX(-100%); }

.rosca { position: relative; display: grid; place-items: center; width: min(184px, 100%); aspect-ratio: 1; margin: 0 auto 16px; }
.rosca svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rosca circle { fill: none; stroke-width: 4.6; }   /* raio 15 + metade do traço = 17,3: cabe na caixa de 36 */
.rosca-c { position: absolute; display: grid; text-align: center; }
.rosca-c strong { font-family: var(--font-head); font-weight: 800; font-size: 21px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rosca-c small { font-size: 12px; color: var(--ink-3); }
.rosca-leg { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 7px; }
.rosca-leg li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; gap: 9px; font-size: 13.5px; }
.rosca-leg i { width: 10px; height: 10px; border-radius: 3px; }
.rosca-leg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rosca-leg b { font-weight: 800; font-variant-numeric: tabular-nums; }
.rosca-leg small { min-width: 70px; text-align: right; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pn-minis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: auto; }
.mini { display: grid; gap: 3px; min-width: 0; padding: 11px 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); text-decoration: none; color: inherit; transition: background .14s var(--ease); }
.mini:hover { background: var(--surface-2); }
.mini > span { font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
.mini strong { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini strong i { width: 3px; height: 16px; border-radius: 2px; flex: none; }
.mini small { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.gl, .gc { flex: 1; display: flex; flex-direction: column; min-height: 200px; }
.gl-plot { position: relative; flex: 1; margin-top: 22px; }
.gl-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gl-guia { position: absolute; top: -10px; bottom: 0; border-left: 1px solid var(--line); }
.gl-linha { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.gl-ponto { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--ink); }
.gl-val { position: absolute; transform: translate(-50%, calc(-100% - 8px)); font-size: 11.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gl-val.baixo { transform: translate(-50%, 8px); }   /* vale: o número vai embaixo, para não cruzar a linha */
.gl-x { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 12px; font-size: 12px; color: var(--ink-3); text-align: center; }
.gc-leg { display: flex; gap: 14px; margin: 0; font-size: 12.5px; color: var(--ink-2); }
.gc-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.gc-area { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 14px; border-bottom: 1px solid var(--line); }
.gc-dia { display: flex; justify-content: center; align-items: flex-end; gap: 5px; min-height: 140px; }
.gc-dia i { width: 7px; border-radius: 4px 4px 1px 1px; }
.gc-a { background: var(--serie-a); } .gc-b { background: var(--serie-b); }

.pn-tab { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.pn-tab th { padding: 9px 12px; background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--ink-3); text-align: left; }
.pn-tab th:first-child { border-radius: var(--r-xs) 0 0 var(--r-xs); } .pn-tab th:last-child { border-radius: 0 var(--r-xs) var(--r-xs) 0; text-align: right; }
.pn-tab td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.pn-tab tr:last-child td { border-bottom: 0; }
.pn-tab td b { display: block; font-weight: 800; }
.pn-tab td small { font-size: 12px; color: var(--ink-3); }
.pn-tab td:last-child { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 1150px) { .pn-grade { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "area area" "rosca top" "linha barras"; } }
@media (max-width: 760px) {
  .pn-grade { grid-template-columns: minmax(0, 1fr); grid-template-areas: "area" "rosca" "top" "linha" "barras"; gap: 14px; margin-bottom: 14px; }
  .ga { padding-left: 46px; min-height: 230px; }
  .pn-num strong { font-size: 22px; }
}
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.status-bars { display: grid; gap: 10px; }
.status-bar { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-weight: 500; font-size: 14px; text-decoration: none; color: inherit; padding: 4px 0; }
.status-bar .bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.status-bar .bar i { display: block; height: 100%; border-radius: 999px; }

/* ---------- Pedidos: filtros e lista (tabela) ---------- */
.filtros { display: grid; gap: 12px; margin-bottom: 16px; }
.filtros .linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.busca { position: relative; flex: 1 1 260px; }
.busca .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.busca .in { padding-left: 40px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--ink-2); transition: background .14s, color .14s, border-color .14s; }
.chip:hover { background: var(--surface-2); color: var(--ink); }
a.chip { text-decoration: none; }
.chk input.switch { width: 42px; height: 24px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); box-shadow: var(--glow); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; filter: var(--dot-filter); }
.chip.off { opacity: .55; }
.tabela { padding: 0; overflow: hidden; }
.tab-cab { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 16px; padding: 11px 22px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--ink-3); }
.tab-cab span:last-child { text-align: right; }
.tab-pe { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 22px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }
.tab-pe:empty, .tab-pe .mais:empty { display: none; }
.lista-ped { display: grid; }
.ped { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 14px 22px; cursor: pointer; color: inherit; transition: background .12s; }
.ped:first-child { border-top: 0; }
.ped:hover { background: var(--surface-2); }
.card > .lista-ped { margin: 0 -22px -22px; border-top: 1px solid var(--line); }
.card.tabela > .lista-ped { margin: 0; border-top: 0; }
.ped .quando { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.ped .quando small { display: block; font-family: var(--font-num); font-weight: 500; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.ped .quando.hoje { color: var(--rose-600); }
.ped .quando.atraso { color: var(--error); }
.ped .meio { min-width: 0; }
.ped .nome { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ped .cod { font-family: var(--font-num); font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
.ped .itens { color: var(--ink-2); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-top: 2px; }
.ped .dir { text-align: right; display: grid; gap: 5px; justify-items: end; }
.ped .total { font-weight: 600; font-size: 15px; }
@media (max-width: 640px) {
  .tab-cab { display: none; }
  .ped { grid-template-columns: minmax(0, 1fr) auto; padding: 13px 16px; }
  .card > .lista-ped { margin: 0 -16px -16px; }
  .ped .quando { grid-column: 1 / -1; display: flex; gap: 6px; align-items: baseline; }
  .ped .quando small { display: inline; margin: 0; }
  .tab-pe { padding: 12px 16px; }
}
/* Status vindo do cadastro (cor do banco): pílula tingida com ponto */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink); background: rgba(var(--c-rgb, 110, 75, 58), .14); box-shadow: inset 0 0 0 1px rgba(var(--c-rgb, 110, 75, 58), .28); }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c, #6E4B3A); filter: var(--dot-filter); flex: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.tag.pago { background: var(--teal-50); color: var(--teal); }
.tag.sinal { background: var(--warm-50); color: var(--gold); }
.tag.pend { background: var(--rose-50); color: var(--rose-600); }
.tag.cinza { background: var(--surface-2); color: var(--ink-2); }
.tag .ic { width: 13px; height: 13px; }
/* ---------- Avaliações dos clientes (sql/avaliacoes.sql) ---------- */
.aval-estrelas { display: inline-flex; gap: 1px; vertical-align: middle; }
.aval-estrelas .ic { width: 19px; height: 19px; fill: var(--gold); stroke: none; }
.aval-estrelas .ic.vazia { fill: var(--surface-3); }
.aval-site { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
.aval-site label { cursor: pointer; }
.aval-site .switch { margin-top: 2px; }
.aval-site strong { display: block; font-size: 15.5px; }
.aval-site p { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }
.aval-site a { font-weight: 700; }

/* Cartão fidelidade: as estrelas são o selo do logo (cheio: a fita turquesa com o coração de chocolate) */
.fid-selos { display: inline-flex; gap: 4px; vertical-align: middle; }
.fid-selos svg { width: 26px; height: 26px; flex: none; }
.fid-selos svg g { fill: var(--surface-3); } .fid-selos svg path { fill: var(--line-2); }
.fid-selos svg.cheio g { fill: var(--logo-fita); } .fid-selos svg.cheio path { fill: var(--logo-chocolate); }
.fid-regras { margin-bottom: 18px; }
.fid-liga { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
.fid-liga label { cursor: pointer; } .fid-liga .switch { margin-top: 2px; }
.fid-liga strong { display: block; font-size: 15.5px; }
.fid-liga p { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }
.fid-salvar { display: flex; justify-content: flex-end; margin-top: 6px; }
.fid-lista .card-h { flex-wrap: wrap; }
.fid-busca { max-width: 260px; }
.fid-clientes { list-style: none; margin: 0 -22px -22px; padding: 0; border-top: 1px solid var(--line); }
.fid-clientes li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
.fid-clientes li:last-child { border-bottom: 0; }
.fid-clientes li.premio { background: var(--accent-wash); }
.fid-quem, .fid-cartao { display: grid; gap: 3px; min-width: 0; }
.fid-quem b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fid-quem small, .fid-cartao small { color: var(--ink-3); font-size: 12.5px; }
.premio .fid-cartao small { color: var(--teal); font-weight: 800; }
.fid-acoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.fid-gav .fid-selos svg { width: 30px; height: 30px; }
.fid-gav-txt { margin: 10px 0 2px; font-weight: 700; }
.fid-gav .btn { margin-top: 10px; }
.fid-hist-topo { display: grid; gap: 6px; margin-bottom: 16px; }
.fid-hist-topo p { margin: 0; }
.fid-hist-t { font-size: 15px; font-weight: 800; margin: 0 0 8px; }
.fid-hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.fid-hist li { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.fid-hist span { display: grid; gap: 2px; min-width: 0; }
.fid-hist small { color: var(--ink-3); font-size: 12.5px; }
@media (max-width: 760px) {
  .fid-clientes { margin: 0 -16px -16px; }
  .fid-clientes li { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 14px 16px; }
  .fid-acoes { justify-content: flex-start; }
  .fid-busca { max-width: none; width: 100%; }
}
.aval-filtro { margin-bottom: 14px; }
.aval-lista { display: grid; gap: 12px; }
.aval-card { padding: 16px 18px; }
.aval-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.aval-nota { font-weight: 800; font-size: 14px; }
.aval-quando { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.aval-txt { margin: 10px 0 0; font-size: 15px; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; max-width: 70ch; }
.aval-txt.sem { color: var(--ink-3); font-size: 14px; }
.aval-quem { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 10px 0 0; font-size: 13.5px; color: var(--ink-2); }
.aval-quem strong { color: var(--ink); }
.aval-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.aval-acoes .btn.icon { margin-left: auto; }
.vazio { text-align: center; padding: 40px 16px; color: var(--ink-2); }
.vazio h2 { font-family: var(--font-head); font-weight: 800; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
.mais { display: flex; justify-content: center; margin-top: 14px; }
.tab-pe .mais { margin: 0; }
.skel { height: 74px; border-radius: var(--r-sm); background: var(--surface-2); animation: pulsa 1.3s ease-in-out infinite; }
@keyframes pulsa { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.lista-ped .skel { margin: 12px 22px; height: 56px; }
@keyframes brilho { to { background-position: -200% 0; } }

/* ---------- Gaveta do pedido ---------- */
.veu { position: fixed; inset: 0; background: rgba(46, 19, 8, .42); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
.veu.on { opacity: 1; pointer-events: auto; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); z-index: 51; background: var(--bg); box-shadow: var(--shadow-lg); border-left: 1px solid var(--line); transform: translateX(104%); transition: transform .28s var(--ease); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.gaveta.on { transform: none; }
.gav-h { display: flex; align-items: center; gap: 10px; min-height: var(--topbar); padding: 10px 14px 10px 18px; background: var(--bg); border-bottom: 1px solid var(--line); }
.gav-h h2 { font-family: var(--font-head); font-weight: 800; font-size: 20px; letter-spacing: -.02em; flex: 1; min-width: 0; }
.gav-h small { display: block; font-family: var(--font-ui); font-size: 12.5px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; margin-top: 1px; }
.gav-b { flex: 1; overflow-y: auto; padding: 18px 18px calc(30px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
.gav-b .card { padding: 18px; box-shadow: var(--shadow-sm); }
.gav-b .card + .card { margin-top: 14px; }
.acoes-topo { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.modelos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.btn.wa:hover { background: #1A7A49; }
.status-sel { display: flex; flex-wrap: wrap; gap: 8px; }
.st-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; color: var(--ink); transition: background .14s; }
.st-btn:hover { background: var(--surface-2); }
.st-btn .dot { width: 9px; height: 9px; border-radius: 50%; filter: var(--dot-filter); }
.st-btn[aria-current="true"] { color: #fff; border-color: transparent; box-shadow: var(--shadow-sm); }
.st-btn[aria-current="true"] .dot { filter: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }
.prox { margin-top: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
.kv dd a[href^="tel:"] { white-space: nowrap; }
.it { padding: 11px 0; border-bottom: 1px solid var(--line); }
.it:last-child { border-bottom: 0; }
.it-l { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.it-d { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.it-d b { color: var(--ink); }
.it-d.it-kit { margin-top: 6px; padding: 7px 10px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); border-left: 3px solid var(--teal); }
/* Imagem de referência do item (topper) */
.it-ref { display: flex; gap: 12px; align-items: center; margin-top: 8px; padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.it-ref-img { flex: none; display: block; width: 88px; height: 88px; border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.it-ref-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
.it-ref-img:hover img { transform: scale(1.05); }
.it-ref-acoes { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
/* no celular, ao lado da foto sobra pouco: o botão quebra a linha em vez de passar da borda ("Enviar para quem faz o topo") */
.it-ref-acoes .btn { max-width: 100%; white-space: normal; text-align: left; line-height: 1.25; padding-top: 7px; padding-bottom: 7px; }
.it-ref-acoes > span { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.it-ref.sem { justify-content: space-between; flex-wrap: wrap; border-style: dashed; border-color: rgba(var(--rose-rgb), .5); }
.it-ref.sem > span { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--rose-600); }
.it-ref.sem > span .ic { width: 16px; height: 16px; }
.topo-prev { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.topo-prev img { width: 96px; height: 96px; object-fit: cover; border-radius: 14px; flex: none; box-shadow: 0 0 0 1px var(--line); }
.topo-prev strong { display: block; font-size: 16px; }
.topo-prev small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.ed-ref { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.ed-ref img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
.ed-ref span { flex: 1; }
.hj-ref { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--teal); text-decoration: none; }
.hj-ref img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
.st-sinal { margin: 0 0 14px; }
.valores .lin { display: flex; justify-content: space-between; padding: 4px 0; font-weight: 500; }
.valores .lin.tot { font-family: var(--font-head); font-size: 20px; font-weight: 800; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.valores .lin.saldo { color: var(--rose-600); font-weight: 600; }
.valores .lin.quit { color: var(--teal); font-weight: 600; }
.pgto { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.pgto small { display: block; color: var(--ink-3); }
.obs { padding: 11px 13px; border-radius: var(--r-sm); background: var(--surface-2); margin-bottom: 8px; }
.obs.fix { background: var(--warm-50); box-shadow: inset 0 0 0 1px rgba(var(--gold-rgb), .35); }
.obs p { margin: 0; white-space: pre-wrap; }
.obs .meta { display: flex; align-items: center; gap: 6px; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.obs .meta .bt { display: flex; gap: 2px; }
.hist { list-style: none; padding: 0; margin: 0; }
.hist li { position: relative; padding: 0 0 16px 26px; font-size: 13.5px; }
.hist li::before { content: ''; position: absolute; left: 4px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--c, var(--teal)); filter: var(--dot-filter); box-shadow: 0 0 0 3px var(--surface); }
.hist li::after { content: ''; position: absolute; left: 9px; top: 19px; bottom: 0; width: 1px; background: var(--line-2); }
.hist li:last-child::after { display: none; }
.hist small { display: block; color: var(--ink-3); font-family: var(--font-num); font-size: 11.5px; margin-top: 1px; }
.hist em { display: block; font-style: normal; color: var(--ink-2); }
.cliente-obs { background: var(--warm-50); border-radius: var(--r-sm); padding: 11px 13px; margin-top: 12px; }

/* ---------- Modal ---------- */
.modal-veu { position: fixed; inset: 0; z-index: 70; background: rgba(46, 19, 8, .45); display: grid; place-items: center; padding: 20px; animation: aparece .18s var(--ease); }
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); animation: sobe .22s var(--ease); }
.modal.largo { width: min(840px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px 24px; border-bottom: 1px solid var(--line); }
.modal-h h2 { font-family: var(--font-head); font-weight: 800; font-size: 20px; letter-spacing: -.02em; flex: 1; }
.modal-b { padding: 20px 24px; overflow-y: auto; overscroll-behavior: contain; }
.modal-f { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 24px 18px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-xl) var(--r-xl); }
.modal-f .esq { margin-right: auto; }
@keyframes aparece { from { opacity: 0; } }
@media (max-width: 640px) {
  .modal-veu { padding: 0; place-items: end stretch; }
  .modal, .modal.largo { width: 100%; max-height: 94vh; border-radius: var(--r-xl) var(--r-xl) 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .modal-f { border-radius: 0; }
  .modal-f .btn { flex: 1; }
  .modal-f .esq { flex-basis: 100%; margin: 0; }
}

/* ---------- Toasts ---------- */
.toasts { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(460px, calc(100% - 24px)); }
@media (max-width: 991px) { .toasts { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
.toast { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-radius: 14px; background: #2E1308; color: #FFF4E6; border: 1px solid rgba(255, 233, 214, .12); box-shadow: var(--shadow-lg); font-weight: 500; font-size: 14px; animation: sobe .22s var(--ease); }
.toast.erro { background: #8C1D18; }
.toast.novo { background: var(--logo-petroleo); }
.toast .acao { margin-left: auto; background: rgba(255, 255, 255, .16); color: inherit; border: 0; border-radius: 10px; min-height: 34px; padding: 0 12px; font-weight: 600; cursor: pointer; }
@keyframes sobe { from { transform: translateY(10px); opacity: 0; } }

/* ---------- Cardápio ---------- */
.cat-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.cat-bar .chips { flex: 1 1 300px; }
.grupo { margin-bottom: 22px; }
.grupo-h { display: flex; align-items: center; gap: 10px; padding: 6px 4px 10px; flex-wrap: wrap; }
.grupo-h h2 { font-family: var(--font-head); font-weight: 800; font-size: 18px; letter-spacing: -.015em; }
.grupo-h .info { color: var(--ink-3); font-size: 13px; }
.grupo-h .acts { margin-left: auto; display: flex; gap: 6px; }
.grupo.off .grupo-h h2 { opacity: .5; text-decoration: line-through; }
.prods { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.prod { display: grid; grid-template-columns: 52px minmax(0, 1fr) 180px auto auto; gap: 14px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); transition: background .12s; }
.prod:hover { background: var(--surface-2); }
.prod:first-child { border-top: 0; }
.prod.off .p-nome, .prod.off .thumb { opacity: .45; }
.thumb { width: 52px; height: 52px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.p-nome { min-width: 0; }
.p-nome strong { display: block; font-size: 14.5px; overflow-wrap: anywhere; }
.p-nome small { color: var(--ink-3); font-size: 12.5px; }
.p-nome .tag { margin-left: 6px; background: var(--rose-50); color: var(--rose-600); }
.preco-in { display: flex; align-items: center; gap: 6px; }
.preco-in .money { flex: 1; }
.preco-in .in { min-height: 38px; padding-top: 6px; padding-bottom: 6px; text-align: right; font-weight: 500; }
.preco-in small { color: var(--ink-3); font-size: 12px; min-width: 26px; white-space: nowrap; }
.preco-in .in.salvo { border-color: var(--teal); background: var(--teal-50); }
@media (max-width: 720px) {
  .prod { grid-template-columns: 52px minmax(0, 1fr) auto; padding: 11px 14px; }
  .prod .preco-in { grid-column: 2 / 3; }
  .prod .sw { grid-row: 1; grid-column: 3; }
  .prod .ed { grid-column: 3; grid-row: 2; }
}

/* ---------- Ajustes ---------- */
.sub-tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 18px; padding: 4px; width: fit-content; max-width: 100%; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); scrollbar-width: none; }
.sub-tabs::-webkit-scrollbar { display: none; }
.sub-tabs a { padding: 8px 15px; border-radius: 10px; font-weight: 600; font-size: 13.5px; color: var(--ink-3); text-decoration: none; white-space: nowrap; transition: background .14s, color .14s; }
.sub-tabs a:hover { color: var(--ink); }
.sub-tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--line); }
.tbl { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.tbl .r { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-top: 1px solid var(--line); transition: background .12s; }
.tbl .r:hover { background: var(--surface-2); }
.tbl .r:first-child { border-top: 0; }
.tbl .r .main { flex: 1; min-width: 0; }
.tbl .r .main strong { display: block; overflow-wrap: anywhere; }
.tbl .r .main small { color: var(--ink-3); display: block; }
.tbl .r.off .main { opacity: .5; }
.ban-img { width: 84px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--surface-2); flex: none; }
.cor { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
.pausa { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: var(--r); margin-bottom: 18px; border: 1px solid var(--line); }
.pausa.on { background: var(--teal-50); border-color: rgba(var(--teal-rgb), .25); }
.pausa.off { background: var(--rose-50); border-color: rgba(var(--rose-rgb), .25); }
.pausa strong { display: block; font-family: var(--font-head); font-size: 17px; letter-spacing: -.01em; }
.pausa span { color: var(--ink-2); font-size: 13.5px; }
.foto-campo { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.foto-campo .prev { width: 96px; height: 96px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--ink-3); font-size: 12px; font-weight: 500; text-align: center; box-shadow: inset 0 0 0 1px var(--line); }
.foto-campo .prev img { width: 100%; height: 100%; object-fit: cover; }
.foto-campo .bt { display: flex; gap: 8px; flex-wrap: wrap; }
.faixas .fx { display: grid; grid-template-columns: 1.2fr .8fr .8fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
.faixas .fx .field { margin: 0; }
@media (max-width: 560px) { .faixas .fx { grid-template-columns: 1fr 1fr; } }
.secao-t { font-family: var(--font-ui); font-weight: 600; font-size: 12.5px; letter-spacing: 0; color: var(--ink-3); margin: 20px 0 10px; }
.secao-t.linha { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; }   /* seções de Ajustes > Loja */
.ajuste-dica { font-size: 12.5px; color: var(--ink-3); margin: -6px 0 14px; }
.pesos-faixa { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; }   /* Opções de bolo: vários pesos de uma vez */
.pesos-faixa .field { margin: 0; }
@media (max-width: 560px) { .pesos-faixa { grid-template-columns: 1fr 1fr; } .pesos-faixa .btn { grid-column: 1 / -1; } }
.aviso-box { padding: 12px 14px; border-radius: var(--r-sm); background: var(--warm-50); font-size: 13.5px; margin-bottom: 14px; }
.aviso-box code { background: var(--surface); padding: 1px 6px; border-radius: 6px; font-family: var(--font-num); font-size: 12px; }

/* ---------- Filtros da lista de pedidos ---------- */
.filtros .linha[hidden], .f-mais[hidden] { display: none; }
.f-cont { margin-left: 6px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--teal); color: var(--on-teal); font-size: 11.5px; font-weight: 700; }
.f-cont[hidden] { display: none; }
.f-datas { gap: 8px; }
.f-datas .in { width: auto; min-height: 40px; }
.f-datas .dt-btn { min-width: 170px; }
.f-de { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.dias-ret { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.dia-ret { flex: none; display: grid; justify-items: center; align-content: center; gap: 1px; min-width: 70px; padding: 7px 8px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; font: inherit; transition: background .14s, border-color .14s; }
.dia-ret:hover { background: var(--surface-2); }
.dia-ret .dr-sem { font-size: 12.5px; font-weight: 700; letter-spacing: 0; }
.dia-ret.domingo .dr-sem { color: var(--rose-600); }
.dia-ret b { font-family: var(--font-num); font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.dia-ret .dr-n { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.dia-ret.outro { min-width: 92px; gap: 4px; }
.dia-ret.outro .ic { width: 18px; height: 18px; }
.dia-ret[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: var(--glow); }
.dia-ret[aria-pressed="true"] b, .dia-ret[aria-pressed="true"] .dr-n, .dia-ret[aria-pressed="true"] .dr-sem { color: inherit; }
/* busca, período, status e "Mais filtros" numa linha; no celular: busca + filtros, e os dois menus lado a lado */
.f-topo { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.f-per { flex: 0 1 190px; }
.f-st { position: relative; flex: 0 1 220px; }
.f-st.com-cor::before { content: ''; position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--cor); filter: var(--dot-filter); pointer-events: none; }
.f-st.com-cor .sel { padding-left: 31px; }
.f-topo .sel { text-overflow: ellipsis; }
@media (pointer: coarse) { .f-topo .in, .f-topo .sel { min-height: 44px; } }   /* no toque, da altura dos botões */
@media (max-width: 760px) {
  /* os dois menus meio a meio; o botão de filtros (só o ícone, com o número no canto) ao lado da busca */
  .f-topo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .f-topo .busca { grid-column: 1 / -1; grid-row: 1; margin-right: 54px; }
  .f-topo #fMaisBt { grid-column: 2; grid-row: 1; justify-self: end; position: relative; width: 44px; padding: 0; }
  .f-topo #fMaisBt .f-cont { position: absolute; top: -7px; right: -7px; margin: 0; }
  .f-per { grid-column: 1; grid-row: 2; }
  .f-st { grid-column: 2; grid-row: 2; }
  .f-mais-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dias-ret { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: visible; }
  .dia-ret, .dia-ret.outro { min-width: 0; }
}
.f-mais { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
.f-mais .field { margin: 0; }
.f-mais .sel:disabled { opacity: .55; }
@media (max-width: 760px) { .f-mais { grid-template-columns: 1fr 1fr; } }
.tab-pe .link { font-size: 13px; margin-left: 6px; }

/* ---------- Estoque ---------- */
.est-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.est-kpi { display: grid; gap: 2px; text-align: left; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; color: var(--ink); font: inherit; }
.est-kpi strong { font-family: var(--font-num); font-size: 26px; font-weight: 700; line-height: 1.1; }
.est-kpi span { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.est-kpi.sinal strong { color: var(--gold); }
.est-kpi.pend strong { color: var(--rose-600); }
.est-kpi[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(var(--teal-rgb), .18); }
.est-grupo + .est-grupo { margin-top: 16px; }
.est-cab { display: flex; align-items: center; gap: 10px; padding: 13px 22px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.est-cab h2 { font-size: 14.5px; font-weight: 700; margin: 0; flex: 1; }
.est-linha { display: grid; grid-template-columns: minmax(0, 1fr) 92px 104px auto; gap: 8px 16px; align-items: center; padding: 10px 14px 10px 22px; border-top: 1px solid var(--line); }
.est-linha:first-child { border-top: 0; }
.est-nome { display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; cursor: pointer; min-width: 0; }
.est-nome strong { font-size: 15px; font-weight: 600; }
.est-nome small { font-size: 12.5px; color: var(--ink-3); }
.est-nome:hover strong { text-decoration: underline; text-underline-offset: 3px; }
.est-qtd { text-align: right; line-height: 1.15; }
.est-qtd b { font-family: var(--font-num); font-size: 19px; font-weight: 700; }
.est-qtd small { display: block; font-size: 12px; color: var(--ink-3); }
.est-linha.acabando .est-qtd b { color: var(--gold); }
.est-linha.acabou .est-qtd b { color: var(--rose-600); }
.est-linha.pausado { opacity: .65; }
.est-linha > .tag { justify-self: center; }
.est-bts { display: flex; gap: 4px; }
@media (max-width: 640px) {
  .est-linha { grid-template-columns: minmax(0, 1fr) auto; padding: 12px 14px; }
  .est-linha > .tag { justify-self: start; }
  .est-bts { justify-self: end; }
  .est-kpis { gap: 8px; }
  .est-kpi { padding: 10px 12px; }
  .est-kpi strong { font-size: 21px; }
}
.est-cons { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.est-cons [hidden] { display: none !important; }
.est-cons-q { display: flex; align-items: center; gap: 6px; }
.est-cons-q .in { width: 76px; text-align: right; }
.est-cons-q > span:last-child { min-width: 54px; color: var(--ink-2); font-weight: 600; font-size: 13.5px; }
.est-cons-g, .est-cons-cada { color: var(--ink-3); font-size: 13.5px; white-space: nowrap; }
.est-cons .sel[data-cons-base] { width: auto; }
@media (max-width: 560px) {
  .est-cons { grid-template-columns: minmax(0, 1fr) auto; padding-bottom: 8px; border-bottom: 1px dashed var(--line-2); }
  .est-cons [data-cons-prod] { grid-column: 1 / -1; }
}
.est-un-in { display: flex; align-items: center; gap: 8px; }
.est-un-in .in { flex: 1; min-width: 0; }
.est-un-in span { color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.est-atual { margin: 0; font-size: 14px; color: var(--ink-2); }
.est-tipos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
.est-tipo { position: relative; display: block; cursor: pointer; }
.est-tipo input { position: absolute; opacity: 0; pointer-events: none; }
.est-tipo > span { display: grid; gap: 2px; height: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); }
.est-tipo small { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.est-tipo input:checked + span { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(var(--teal-rgb), .18); background: rgba(var(--teal-rgb), .06); }
.est-tipo input:focus-visible + span { outline: 3px solid rgba(var(--teal-rgb), .45); outline-offset: 1px; }
@media (max-width: 560px) { .est-tipos { grid-template-columns: 1fr; } }
.est-topo { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.est-grande b { font-family: var(--font-num); font-size: 40px; font-weight: 700; line-height: 1; }
.est-grande span { margin-left: 6px; font-size: 16px; color: var(--ink-2); font-weight: 600; }
.est-topo .dica { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); }
.est-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }
.est-ligados { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }
.est-obs { margin: 0; white-space: pre-line; font-size: 14px; }
.est-hist { list-style: none; margin: 0; padding: 0; }
.est-hist li { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.est-hist li:first-child { border-top: 0; }
.est-h-q { font-family: var(--font-num); font-weight: 700; text-align: right; }
.est-hist li.mais .est-h-q { color: var(--teal); }
.est-hist li.menos .est-h-q { color: var(--rose-600); }
.est-h-t small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 1px; }

/* ---------- Impressão automática (Minha conta) ---------- */
.imp-auto { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface-2); }
.imp-linha { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.imp-linha .sel { flex: 1; min-height: 38px; }
.imp-auto .dica { font-size: 12px; line-height: 1.45; color: var(--ink-3); margin: 0; }
/* ---------- Stories: a galeria (gs-) e a imagem aberta (sv-) ---------- */
.gs-filtro { max-width: 320px; margin: 0 0 16px; }
.gs-grupo + .gs-grupo { margin-top: 22px; }
.gs-pasta { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font-family: var(--font-head); font-size: 17px; font-weight: 800; }
.gs-pasta small { font-family: var(--font-body, inherit); font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.gs-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.gs-card { position: relative; display: block; width: 100%; aspect-ratio: 9 / 16; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface-2); cursor: pointer; box-shadow: var(--shadow-sm, none); transition: transform .15s, box-shadow .15s; }
.gs-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gs-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.gs-card:focus-visible { outline: 3px solid rgba(var(--teal-rgb), .55); outline-offset: 2px; }
.gs-tit { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 9px 8px; background: linear-gradient(transparent, rgba(0, 0, 0, .72)); color: #fff; font-size: 12.5px; font-weight: 700; line-height: 1.3; text-align: left;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gs-card.skel { cursor: default; border: 0; }
#stCorpo.soltar { outline: 2px dashed var(--teal); outline-offset: 8px; border-radius: 14px; }
.gs-vazio .ic { width: 40px; height: 40px; color: var(--teal); margin-bottom: 8px; }
.gs-vazio p { max-width: 460px; margin: 0 auto 16px; line-height: 1.5; }
.gs-envio { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; max-height: 300px; overflow: auto; margin: 0 0 14px; padding: 2px; }
.gs-envio figure { margin: 0; }
.gs-envio figure > div { position: relative; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.gs-envio img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gs-envio figcaption { margin-top: 4px; font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gs-envio .feito > div::after { content: '✓'; position: absolute; inset: auto 6px 6px auto; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); color: var(--on-teal); font-size: 13px; font-weight: 800; }
.gs-envio .erro > div { border-color: var(--error, #c0392b); box-shadow: 0 0 0 2px var(--error, #c0392b); }
.sv { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 22px; align-items: start; }

}
/* driver da térmica: em Minha conta e na ajuda "Instalar a térmica" */

/* ---------- Niimbot (Minha conta e barra de cima) ---------- */
.nb-corpo[hidden] { display: none; }

.nb-previa { display: flex; justify-content: center; padding: 10px; margin-bottom: 8px; border-radius: var(--r-sm); background: var(--surface); border: 1px dashed var(--line-2); font-size: 12.5px; color: var(--ink-3); }
.nb-previa canvas { display: block; height: auto; max-width: 100%; border-radius: 6px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .12); image-rendering: pixelated; }
.nb-ind .nb-ponto { position: absolute; right: 6px; bottom: 6px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
.nb-ind.on .nb-ponto { background: var(--teal); }
.nb-ind.off .nb-ponto { background: var(--rose-600); }

/* ---------- Etiquetas em lote ---------- */
.lote-conteudo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
@media (max-width: 560px) { .lote-conteudo { grid-template-columns: 1fr; } }

.lote-it { display: grid; grid-template-columns: auto 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); cursor: pointer; }

/* ---------- Avisos (sino da barra de cima) ---------- */

.avisos-menu { width: min(370px, calc(100vw - 16px)); max-height: min(72vh, 540px); overflow-y: auto; }

.tema-menu .av-cab .link { width: auto; padding: 4px 0; font-size: 12.5px; color: var(--teal); }

/* ---------- App instalado: aviso de sem internet e o passo a passo para instalar ---------- */
.sem-rede { position: fixed; z-index: 70; left: 50%; top: calc(env(safe-area-inset-top, 0px) + var(--topbar) + 10px); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 24px); padding: 9px 16px; border-radius: 999px; background: var(--error); color: #fff; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); }
