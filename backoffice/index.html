/*
  Tema do backoffice: anatomia inspirada no painel "Vireo" (sidebar com seções, barra superior,
  cabeçalho com trilha, cartões amplos, faixa de indicadores) com as cores da Rita Bolos.
  Os nomes das variáveis antigas (--ink, --teal, --surface-2...) foram mantidos: o app.js usa várias em estilos inline.
*/
:root {
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  --bg: #F8F2EA; --surface: #FFFFFF; --surface-2: #F6EEE4; --surface-3: #ECE0D2; --glass: rgba(255, 252, 248, .82);
  --ink: #3A1F14; --ink-2: #6E4B3A; --ink-3: #7E5F4C; --line: rgba(58, 31, 20, .10); --line-2: rgba(58, 31, 20, .19);
  --primary: #4A2A1C; --on-primary: #FFF8F0; --primary-hover: #5E3826; --primary-rgb: 74, 42, 28;
  --teal: #2B7465; --on-teal: #FFFFFF; --teal-rgb: 43, 116, 101; --teal-50: #E3F1EC; --mint: #7DC4B0;
  --rose: #E890A8; --rose-600: #A8405F; --rose-50: #FCEDF1; --rose-rgb: 168, 64, 95;
  --warm-50: #FCF0DC; --gold: #8A6418; --gold-rgb: 169, 128, 47;
  --error: #B3261E; --error-50: #FCE8E6;
  --focus: #E890A8;
  --accent-wash: rgba(43, 116, 101, .10);
  --destaque-a: #2E7D6C; --destaque-b: #1C5247;   /* cartão preenchido (teal da marca) */
  --destaque-sombra: rgba(28, 82, 71, .7);
  --grafico: var(--teal); --grafico-rgb: var(--teal-rgb);   /* barras dos gráficos do relatório */
  --hero-brilho: rgba(var(--teal-rgb), .16);
  --dot-filter: none;
  --shadow-sm: 0 6px 18px -8px rgba(58, 31, 20, .16), 0 2px 6px -2px rgba(58, 31, 20, .07);
  --shadow: 0 18px 44px -22px rgba(58, 31, 20, .24), 0 2px 10px rgba(58, 31, 20, .05);
  --shadow-lg: 0 28px 64px -20px rgba(30, 15, 8, .36), 0 8px 20px -8px rgba(30, 15, 8, .16);
  --glow: 0 12px 26px -10px rgba(var(--primary-rgb), .5);
  --glow-teal: 0 12px 26px -10px rgba(var(--teal-rgb), .55);
  --r-xs: 8px; --r-sm: 12px; --r: 18px; --r-xl: 24px;
  --side: 264px; --topbar: 64px;
  --ease: cubic-bezier(.2, 0, 0, 1);
  color-scheme: light;
}

/* =========================================================
   TEMA CANELA
   Confeitaria artesanal: papel quadriculado creme, contornos de chocolate, tons pastel
   (pervinca, lilás, coral, manteiga), botões em pílula, selos ondulados e títulos em serifa.
   As fontes (Fraunces e Source Serif 4) só são baixadas quando o tema está ativo.
========================================================= */
:root[data-theme="canela"] {
  --font-ui: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-num: 'Fraunces', Georgia, serif;
  --bg: #FFF4CC; --surface: #FFFBEA; --surface-2: #FDF0C4; --surface-3: #F5E2A6; --glass: rgba(255, 244, 204, .94);
  --ink: #4A2418; --ink-2: #6B3A26; --ink-3: #7D4A33; --line: rgba(74, 36, 24, .16); --line-2: rgba(74, 36, 24, .34);
  --contorno: #4A2418; --grade: rgba(140, 158, 226, .3);
  --pervinca: #A5B6EC; --lilas: #DCC6F0; --coral: #FF8A5B; --manteiga: #FDE8A2;
  --primary: #4A2418; --on-primary: #FFF4CC; --primary-hover: #5E3122; --primary-rgb: 74, 36, 24;
  --teal: #3E52A8; --on-teal: #FFFFFF; --teal-rgb: 62, 82, 168; --teal-50: #E3E8FA; --mint: #A5B6EC;
  --rose: #FF8A5B; --rose-600: #A93E1A; --rose-50: #FFE2D3; --rose-rgb: 169, 62, 26;
  --warm-50: #FDEDBF; --gold: #7F5410; --gold-rgb: 127, 84, 16;
  --error: #B3261E; --error-50: #FCE1DC;
  --focus: #8E6CCB;
  --accent-wash: rgba(220, 198, 240, .55);
  --destaque-a: #A5B6EC; --destaque-b: #A5B6EC; --destaque-sombra: rgba(74, 36, 24, .2);
  --grafico: #7286DA; --grafico-rgb: 114, 134, 218;
  --hero-brilho: transparent;
  --dot-filter: none;
  --shadow-sm: 0 3px 0 rgba(74, 36, 24, .12);
  --shadow: 0 4px 0 rgba(74, 36, 24, .14), 0 16px 30px -22px rgba(74, 36, 24, .35);
  --shadow-lg: 0 6px 0 rgba(74, 36, 24, .16), 0 30px 60px -24px rgba(74, 36, 24, .45);
  --glow: 0 3px 0 rgba(74, 36, 24, .25);
  --glow-teal: 0 3px 0 rgba(74, 36, 24, .22);
  --r-xs: 10px; --r-sm: 14px; --r: 22px; --r-xl: 28px;
  color-scheme: light;
}
/* papel quadriculado */
[data-theme="canela"] body { background-image: linear-gradient(var(--grade) 1px, transparent 1px), linear-gradient(90deg, var(--grade) 1px, transparent 1px); background-size: 28px 28px; background-position: -1px -1px; }
[data-theme="canela"] ::selection { background: var(--lilas); color: var(--ink); }
/* títulos em serifa arredondada; rótulos de seção em maiúsculas espaçadas */
[data-theme="canela"] h1, [data-theme="canela"] h2, [data-theme="canela"] h3, [data-theme="canela"] .hero-t, [data-theme="canela"] .dc-val, [data-theme="canela"] .kpi strong, [data-theme="canela"] .hero-stats strong, [data-theme="canela"] .np-total, [data-theme="canela"] .valores .lin.tot { font-variation-settings: 'SOFT' 100; letter-spacing: -.01em; }
[data-theme="canela"] .eyebrow, [data-theme="canela"] .side-sec, [data-theme="canela"] .secao-t { font-family: var(--font-display); font-weight: 600; letter-spacing: .16em; color: var(--ink-2); }
/* cartões, listas e janelas com contorno de chocolate */
[data-theme="canela"] .card, [data-theme="canela"] .tbl, [data-theme="canela"] .modal, [data-theme="canela"] .login-card, [data-theme="canela"] .tema-menu { border: 2px solid var(--contorno); }
[data-theme="canela"] .card > .lista-ped { border-top: 2px solid var(--contorno); }
[data-theme="canela"] .ped, [data-theme="canela"] .tbl .r, [data-theme="canela"] .it { border-top-style: dashed; border-bottom-style: dashed; }
[data-theme="canela"] .ped:hover, [data-theme="canela"] .tbl .r:hover, [data-theme="canela"] .kpi:hover { background: rgba(253, 232, 162, .45); }
[data-theme="canela"] .kpi { border-left: 2px dashed rgba(74, 36, 24, .25); }
[data-theme="canela"] .np-item { border: 2px dashed rgba(74, 36, 24, .28); background: rgba(255, 251, 234, .7); }

/* cartão de destaque: azul pervinca com texto de chocolate */
[data-theme="canela"] .destaque-card { background: var(--pervinca); color: var(--ink); border: 2px solid var(--contorno); box-shadow: var(--shadow); }
[data-theme="canela"] .destaque-card .eyebrow { color: var(--ink-2); }
[data-theme="canela"] .destaque-card p { color: var(--ink); }
[data-theme="canela"] .destaque-card .dc-chip { background: rgba(255, 251, 234, .78); color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(74, 36, 24, .35); }
[data-theme="canela"] .destaque-card .btn { background: var(--primary); color: var(--on-primary); border-color: var(--contorno); }
[data-theme="canela"] .destaque-card .btn:hover { background: var(--primary-hover); }
[data-theme="canela"] .destaque-card .dc-art { color: var(--ink); opacity: .16; }
[data-theme="canela"] .delta.claro, [data-theme="canela"] .delta.claro small { color: var(--ink); }
/* menu lateral, barra superior e menu do celular */
[data-theme="canela"] .side { background: #FFF0BF; border-right: 2px solid var(--contorno); }
[data-theme="canela"] .side-foot { border-top: 2px dashed rgba(74, 36, 24, .25); }
[data-theme="canela"] .nav-a { border-radius: 999px; border: 2px solid transparent; }
[data-theme="canela"] .nav-a:hover { background: rgba(220, 198, 240, .45); }
[data-theme="canela"] .nav-a[aria-current="page"] { background: var(--lilas); border-color: var(--contorno); box-shadow: 0 3px 0 rgba(74, 36, 24, .18); font-weight: 600; }
[data-theme="canela"] .nav-a[aria-current="page"] .ic { color: var(--ink); }
[data-theme="canela"] .nav-a[aria-current="page"]::before { display: none; }
[data-theme="canela"] .topo { background: rgba(255, 244, 204, .94); border-bottom: 2px solid var(--contorno); }
[data-theme="canela"] .topo-busca input { border-radius: 999px; border: 2px solid var(--contorno); background: var(--surface); }
[data-theme="canela"] .topo-busca input:focus { border-color: var(--contorno); box-shadow: 0 0 0 4px rgba(142, 108, 203, .28); }
[data-theme="canela"] .topo-busca kbd { border-radius: 999px; border: 1.5px solid rgba(74, 36, 24, .4); background: var(--manteiga); }
[data-theme="canela"] .topo-bt { border-radius: 999px; }
[data-theme="canela"] .topo-bt[data-act="tema"] { background: var(--lilas); border: 2px solid var(--contorno); }
[data-theme="canela"] .nav-mob { background: rgba(255, 240, 191, .97); border-top: 2px solid var(--contorno); }
[data-theme="canela"] .nav-mob a[aria-current="page"] { background: var(--lilas); box-shadow: inset 0 0 0 2px var(--contorno); }
[data-theme="canela"] .nav-mob a[aria-current="page"] .ic { color: var(--ink); }
[data-theme="canela"] .rodape { border-top: 2px dashed rgba(74, 36, 24, .25); }
/* botões em pílula */
[data-theme="canela"] .btn { border-radius: 999px; border: 2px solid var(--contorno); font-family: var(--font-display); font-weight: 600; font-variation-settings: 'SOFT' 100; }
[data-theme="canela"] .btn.sm { border-radius: 999px; border-width: 1.5px; }
[data-theme="canela"] .btn.icon { border-radius: 50%; }
[data-theme="canela"] .btn.teal { background: var(--pervinca); color: var(--ink); }
[data-theme="canela"] .btn.teal:hover { filter: none; background: #B8C6F2; }
[data-theme="canela"] .btn.ghost { background: var(--surface); border-color: var(--contorno); }
[data-theme="canela"] .btn.ghost:hover { background: var(--manteiga); }
[data-theme="canela"] .btn.danger { background: var(--rose-50); color: var(--error); border-color: var(--error); }
/* campos */
[data-theme="canela"] .in, [data-theme="canela"] .sel, [data-theme="canela"] .ta { border: 2px solid rgba(74, 36, 24, .45); background: #FFFDF3; border-radius: 14px; }
[data-theme="canela"] .in:focus, [data-theme="canela"] .sel:focus, [data-theme="canela"] .ta:focus { border-color: var(--contorno); box-shadow: 0 0 0 4px rgba(142, 108, 203, .25); }
[data-theme="canela"] .switch { border: 2px solid var(--contorno); background: var(--surface-3); }
[data-theme="canela"] .switch::after { top: 1px; left: 1px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--contorno); }
[data-theme="canela"] .switch:checked { background: var(--pervinca); border-color: var(--contorno); }
/* filtros, abas, etiquetas e status */
[data-theme="canela"] .chip { border-radius: 999px; border: 2px solid rgba(74, 36, 24, .35); background: var(--surface); }
[data-theme="canela"] .chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--contorno); }
[data-theme="canela"] .sub-tabs { border-radius: 999px; border: 2px solid var(--contorno); background: var(--surface); }
[data-theme="canela"] .sub-tabs a { border-radius: 999px; }
[data-theme="canela"] .sub-tabs a[aria-current="page"] { background: var(--lilas); box-shadow: inset 0 0 0 2px var(--contorno); }
[data-theme="canela"] .pill { box-shadow: inset 0 0 0 1.5px rgba(var(--c-rgb, 110, 75, 58), .55); }
[data-theme="canela"] .tag { box-shadow: inset 0 0 0 1.2px currentColor; }
[data-theme="canela"] .st-btn { border-radius: 999px; border: 2px solid rgba(74, 36, 24, .3); }
[data-theme="canela"] .st-btn[aria-current="true"] { border-color: var(--contorno); }
/* gráficos do relatório com contorno */
[data-theme="canela"] .g-barra { border: 2px solid var(--contorno); border-bottom: 0; border-radius: 10px 10px 0 0; }
[data-theme="canela"] .gb-trilho { box-shadow: inset 0 0 0 1.5px rgba(74, 36, 24, .3); }
/* janelas, gaveta do pedido e avisos */
[data-theme="canela"] .modal-veu { background: rgba(74, 36, 24, .35); }
[data-theme="canela"] .modal-h { border-bottom: 2px dashed rgba(74, 36, 24, .25); }
[data-theme="canela"] .modal-f { background: var(--manteiga); border-top: 2px solid var(--contorno); }
[data-theme="canela"] .gaveta { border-left: 2px solid var(--contorno); }
[data-theme="canela"] .gav-h { border-bottom: 2px solid var(--contorno); }
[data-theme="canela"] .toast { border: 2px solid var(--contorno); }
/* avatar, escolha de tema e de avatar */
[data-theme="canela"] .avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--contorno); }
[data-theme="canela"] .av-op[aria-checked="true"], [data-theme="canela"] .tema-op[aria-checked="true"] { border-color: var(--contorno); box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--contorno); }
/* tela de entrada com rabiscos e o logo num selo */
[data-theme="canela"] .login { background: none; position: relative; }
[data-theme="canela"] .login::before { content: ''; position: absolute; inset: 0; pointer-events: none;

/* miniatura do tema na escolha de temas: papel quadriculado */
.tema-amostra.canela { background-image: linear-gradient(rgba(140, 158, 226, .55) 1px, transparent 1px), linear-gradient(90deg, rgba(140, 158, 226, .55) 1px, transparent 1px); background-size: 6px 6px; }
.tema-amostra.canela::before { box-shadow: inset 0 0 0 1.5px #4A2418; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: calc(var(--topbar) + 12px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body { font-family: var(--font-ui); color: var(--ink); background: var(--bg); font-size: 14.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; font-weight: 400; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal); }
[hidden] { display: none !important; }
::selection { background: rgba(var(--teal-rgb), .25); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; }
strong, b { font-weight: 600; }
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em; }
.eyebrow { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

/* ---------- Botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid transparent; background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .14s var(--ease), box-shadow .14s var(--ease), transform .1s, border-color .14s; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--glow); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.teal { background: var(--teal); color: var(--on-teal); box-shadow: var(--glow-teal); }
.btn.teal:hover { filter: brightness(1.06); }
.btn.wa { background: #1F8F55; color: #fff; }
.btn.ghost { background: transparent; border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--line-2); }
.btn.danger { background: var(--error-50); color: var(--error); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.icon { width: 40px; padding: 0; }
.btn.icon.sm { width: 34px; }
.btn.block { width: 100%; }
.btn[aria-busy="true"] { pointer-events: none; }
.btn[aria-busy="true"]::before { content: ''; width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: gira .7s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (pointer: coarse) { .btn { min-height: 44px; } .btn.sm { min-height: 38px; } .btn.icon { width: 44px; } .btn.icon.sm { width: 38px; } }
.link { background: none; border: 0; padding: 4px 0; color: var(--teal); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Campos ---------- */
.field { display: grid; gap: 6px; margin-bottom: 14px; align-content: start; }   /* lado a lado com um campo que tem dica: não estica */
.field > label, .field > .lbl { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.field .dica { font-size: 12.5px; color: var(--ink-3); margin: 0; }
.in, .sel, .ta { width: 100%; min-height: 42px; padding: 9px 13px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); font-size: 14.5px; font-weight: 400; transition: border-color .14s, box-shadow .14s; }
.in::placeholder, .ta::placeholder { color: var(--ink-3); opacity: .85; }
.ta { min-height: 84px; resize: vertical; line-height: 1.45; }
.in:hover, .sel:hover, .ta:hover { border-color: rgba(var(--teal-rgb), .45); }
.in:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(var(--teal-rgb), .16); }
.in[aria-invalid="true"] { border-color: var(--error); }
.in:disabled, .sel:disabled, .ta:disabled { opacity: .6; cursor: not-allowed; border-color: var(--line-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.chk { display: flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 500; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--teal); flex: none; }
.switch { appearance: none; -webkit-appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line-2); position: relative; cursor: pointer; flex: none; transition: background .14s; margin: 0; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .18s var(--ease); }
.switch:checked { background: var(--teal); border-color: transparent; }
.switch:checked::after { transform: translateX(18px); }
.money { position: relative; }
.money .in { padding-left: 38px; }
.money::before { content: 'R$'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-weight: 500; color: var(--ink-3); font-size: 13.5px; pointer-events: none; }
.err-msg { color: var(--error); font-weight: 500; font-size: 13.5px; }

/* ---------- Login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(60rem 30rem at 0% -10%, rgba(var(--rose-rgb), .12), transparent 60%), radial-gradient(50rem 28rem at 100% 0%, rgba(var(--teal-rgb), .12), transparent 60%), var(--bg); }
.login-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 34px 30px 30px; box-shadow: var(--shadow); text-align: center; }
.login-card img { width: 104px; height: auto; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .18)); }
.login-card h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 10px 0 2px; color: var(--ink); }
.login-card p.sub { margin: 0 0 24px; color: var(--ink-3); font-weight: 600; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; }
.login-card form { text-align: left; }
.login-card form .btn.block { margin-top: 4px; min-height: 44px; }
.demo-note { margin-top: 18px; padding: 11px 13px; border-radius: var(--r-sm); background: var(--warm-50); font-size: 13px; color: var(--ink-2); text-align: left; }

/* ---------- Estrutura: sidebar + barra superior ---------- */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); z-index: 35; }
.brand { display: flex; align-items: center; gap: 11px; height: var(--topbar); padding: 0 20px; text-decoration: none; color: inherit; flex: none; }
.brand img { width: 38px; height: 38px; object-fit: contain; }
.brand strong { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -.02em; color: var(--ink); display: block; line-height: 1.1; }
.brand span { display: block; font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .14em; margin-top: 2px; }
.side-nav { flex: 1; overflow-y: auto; padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 2px; }
.side-sec { margin: 18px 12px 8px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.side-sec:first-child { margin-top: 10px; }
.nav-a { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 11px; color: var(--ink-2); font-weight: 500; font-size: 14px; text-decoration: none; position: relative; transition: background .14s, color .14s; }
.nav-a .ic { width: 19px; height: 19px; }
.nav-a:hover { background: var(--surface-2); color: var(--ink); }
.nav-a[aria-current="page"] { background: var(--accent-wash); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(var(--teal-rgb), .22); }
.nav-a[aria-current="page"] .ic { color: var(--teal); }
.nav-a[aria-current="page"]::before { content: ''; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--teal); }
.nav-a .ext { margin-left: auto; width: 14px; height: 14px; opacity: .55; }
.nav-badge { margin-left: auto; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(var(--rose-rgb), .14); color: var(--rose-600); font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; }
.side-foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
.user-card { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; color: inherit; }
.user-card:hover { background: var(--surface-2); }
.user-card .uc-t { min-width: 0; }
.user-card strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-card small { display: block; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(135deg, #B9476A, #4A2A1C); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line-2); }
.avatar.av-img { background: none; overflow: hidden; }
.avatar.av-img svg { width: 100%; height: 100%; display: block; }
/* Minha conta: o avatar é o botão para trocar */
.av-trocar { position: relative; display: inline-grid; border-radius: 50%; flex: none; cursor: pointer; }
.av-trocar:hover .avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--teal); }
.av-lapis { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); color: #fff; box-shadow: 0 0 0 2px var(--surface); }
.av-lapis .ic { width: 12px; height: 12px; }
/* Escolha do avatar */
.av-topo { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.av-topo .avatar { width: 64px; height: 64px; font-size: 22px; }
.av-topo strong { display: block; font-size: 16px; }
.av-topo small { display: block; font-size: 13px; color: var(--ink-3); }
.av-grade { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 860px) { .av-grade { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.av-op { aspect-ratio: 1; border-radius: 18px; overflow: hidden; padding: 0; cursor: pointer; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); transition: transform .12s, box-shadow .12s; }
.av-op svg { width: 100%; height: 100%; display: block; }
.av-op:hover { transform: translateY(-2px); }
.av-op[aria-checked="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--teal); }
@media (max-width: 560px) { .av-grade { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } }
.user-box strong { display: block; font-size: 15px; }
.user-box small { display: block; font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }

.coluna { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topo { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: var(--topbar); padding: 0 28px; background: var(--glass); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.topo-marca { display: none; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.topo-marca img { width: 34px; height: 34px; object-fit: contain; }
.topo-marca small { font-family: var(--font-ui); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--rose-600); background: var(--rose-50); padding: 2px 7px; border-radius: 999px; }
.topo-busca { position: relative; flex: 0 1 420px; }
.topo-busca .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 17px; height: 17px; }
.topo-busca input { width: 100%; height: 40px; padding: 0 44px 0 40px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); font-size: 14px; }
.topo-busca input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(var(--teal-rgb), .16); }
.topo-busca input::placeholder { color: var(--ink-3); }
.topo-busca kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); min-width: 24px; height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-3); font-family: var(--font-num); font-size: 11.5px; display: grid; place-items: center; }
.topo-acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.topo-bt { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; text-decoration: none; transition: background .14s, color .14s; position: relative; }
.topo-bt:hover { background: var(--surface-2); color: var(--ink); }
.topo-bt .ic { width: 19px; height: 19px; }
.topo-bt[data-act="tema"] { background: var(--surface-2); }
/* Escolha do tema: menu do botão da barra superior e grade em Minha conta */
.tema-menu { position: fixed; z-index: 90; width: min(268px, calc(100vw - 16px)); padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); animation: temaEntra .14s var(--ease); }
@keyframes temaEntra { from { opacity: 0; transform: translateY(-4px); } }
.tema-menu-t { margin: 4px 10px 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.tema-menu button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; color: var(--ink); }
.tema-menu button:hover, .tema-menu button:focus-visible { background: var(--surface-2); }
.tema-menu button > span:not(.tema-amostra) { flex: 1; min-width: 0; }
.tema-menu strong { display: block; font-size: 14px; font-weight: 600; }
.tema-menu small { display: block; font-size: 12.5px; color: var(--ink-3); }
.tema-menu button > .ic { color: var(--teal); visibility: hidden; }
.tema-menu button[aria-checked="true"] > .ic { visibility: visible; }
.tema-amostra { position: relative; width: 46px; height: 34px; flex: none; border-radius: 9px; overflow: hidden; background: var(--a); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.tema-amostra::before { content: ""; position: absolute; inset: 7px 6px; border-radius: 5px; background: var(--b); box-shadow: 0 1px 3px rgba(0, 0, 0, .16); }
.tema-amostra::after { content: ""; position: absolute; left: 11px; top: 12px; width: 18px; height: 3.5px; border-radius: 3px; background: var(--c); box-shadow: 0 6px 0 var(--d); }
.tema-amostra.auto { background: linear-gradient(135deg, #F8F2EA 0 50%, #120B08 50% 100%); }
.tema-amostra.auto::before { inset: 7px 6px; background: linear-gradient(135deg, #FFFFFF 0 50%, #1C130F 50% 100%); }
.tema-amostra.auto::after { background: linear-gradient(90deg, #4A2A1C 0 50%, #F2DCC6 50% 100%); box-shadow: 0 6px 0 #2B7465; }
.tema-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.tema-op { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.tema-op:hover { background: var(--surface-2); }
.tema-op[aria-checked="true"] { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(var(--teal-rgb), .35); color: var(--ink); }
.tema-op .tema-amostra { width: 52px; height: 38px; }
@media (max-width: 400px) { .tema-grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.topo-av { border: 0; background: none; padding: 2px; margin-left: 4px; cursor: pointer; border-radius: 50%; }
.nav-mob { display: none; }
main.conteudo { padding: 28px 32px 48px; min-width: 0; max-width: 1240px; width: 100%; flex: 1; }
.rodape { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 32px 22px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
.rodape a { color: var(--ink-3); text-decoration: none; margin-left: 16px; }
.rodape a:hover { color: var(--ink); }
.rodape .ver { font-family: var(--font-num); font-size: 11.5px; margin-left: 8px; opacity: .8; }

/* Cabeçalho das telas: trilha, título, subtítulo e ações */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px 18px; flex-wrap: wrap; margin-bottom: 22px; }
.ph-txt { min-width: 0; }
.trilha { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 13px; color: var(--ink-3); }
.trilha a { color: var(--ink-3); display: inline-grid; place-items: center; text-decoration: none; }
.trilha a:hover { color: var(--ink); }
.trilha .ic { width: 15px; height: 15px; }
.trilha .sep { width: 12px; height: 12px; opacity: .6; }
.trilha span { color: var(--ink); font-weight: 500; }
.page-head h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -.025em; line-height: 1.15; }
.ph-sub { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.page-head .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

@media (max-width: 991px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topo { padding: 0 14px; gap: 8px; height: 58px; }
  .topo-marca { display: flex; flex: 1; min-width: 0; }
  .topo-busca { display: none; }
  .topo-bt[data-tv] { display: none; }
  .nav-mob { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--glass); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .nav-mob a { display: grid; justify-items: center; gap: 2px; padding: 7px 2px 6px; border-radius: 12px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-decoration: none; position: relative; }
  .nav-mob a .ic { width: 21px; height: 21px; }
  .nav-mob { grid-auto-columns: minmax(58px, 1fr); overflow-x: auto; scrollbar-width: none; }   /* muitos itens: rola para o lado */
  .nav-mob::-webkit-scrollbar { display: none; }
  .nav-mob a[aria-current="page"] { color: var(--ink); background: var(--accent-wash); }
  .nav-mob a[aria-current="page"] .ic { color: var(--teal); }
  .nav-mob .nav-badge { position: absolute; top: 2px; left: calc(50% + 5px); margin: 0; min-width: 18px; height: 18px; font-size: 10.5px; padding: 0 5px; background: var(--rose-600); color: #fff; }
  main.conteudo { padding: 20px 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .rodape { display: none; }
  .page-head { margin-bottom: 18px; align-items: flex-start; }
  .page-head h1 { font-size: 26px; }
  .ph-sub { font-size: 14px; }
  .trilha { display: none; }
}

/* ---------- Cartões ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.card + .card { margin-top: 18px; }
.hero-grid > .card + .card, .cols > .card + .card { margin-top: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -.015em; }
.card-h .eyebrow { margin-bottom: 4px; }
@media (max-width: 640px) { .card { padding: 16px; } .card + .card { margin-top: 14px; } }

/* Painel: cartão de boas-vindas + cartão preenchido + faixa de indicadores */
.hero-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: center; padding: 26px 26px 24px; }
.hero::after { content: ''; position: absolute; right: -80px; top: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, var(--hero-brilho), transparent 65%); pointer-events: none; }
.hero-t { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -.025em; line-height: 1.15; }
.hero-txt { margin: 8px 0 18px; color: var(--ink-2); font-size: 14.5px; max-width: 52ch; }
.hero-txt b { color: var(--ink); }
.hero-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-stats { display: grid; grid-auto-flow: column; gap: 22px; position: relative; z-index: 1; }
.hero-stats a { text-decoration: none; color: inherit; display: grid; gap: 4px; }
.hero-stats span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.hero-stats strong { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.hero-stats a:hover strong { color: var(--teal); }
.destaque-card { position: relative; overflow: hidden; border: 0; color: #fff; background: linear-gradient(150deg, var(--destaque-a), var(--destaque-b)); box-shadow: 0 22px 44px -22px var(--destaque-sombra); display: flex; flex-direction: column; padding: 24px; }
.destaque-card .eyebrow { color: rgba(255, 255, 255, .78); }
.destaque-card .dc-val { font-family: var(--font-display); font-size: 36px; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
.destaque-card .dc-chip { align-self: flex-start; margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .16); font-size: 12.5px; font-weight: 600; }
.destaque-card p { margin: 14px 0 16px; font-size: 13.5px; color: rgba(255, 255, 255, .82); max-width: 34ch; }
.destaque-card .btn { margin-top: auto; align-self: flex-start; background: rgba(255, 255, 255, .14); color: #fff; border-color: rgba(255, 255, 255, .28); }
.destaque-card .btn:hover { background: rgba(255, 255, 255, .24); }
.destaque-card .dc-art { position: absolute; right: -18px; bottom: -22px; width: 150px; height: 150px; opacity: .13; color: #fff; stroke-width: 1.2; }
.kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); padding: 0; margin-bottom: 18px; overflow: hidden; }
.kpi { display: flex; align-items: center; gap: 14px; padding: 20px 22px; text-decoration: none; color: inherit; border-left: 1px solid var(--line); transition: background .14s; min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi:hover { background: var(--surface-2); }
.kpi-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: rgba(var(--c-rgb, 43, 116, 101), .14); color: var(--c, var(--teal)); }
.kpi-ic .ic { width: 20px; height: 20px; filter: var(--dot-filter); }
.kpi-t { min-width: 0; display: grid; gap: 2px; }
.kpi span { font-size: 12.5px; font-weight: 500; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi strong { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
@media (max-width: 1150px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } .hero { grid-template-columns: minmax(0, 1fr); } .hero-stats { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } }
@media (max-width: 640px) {
  .hero { padding: 20px; } .hero-t { font-size: 25px; } .hero-stats strong { font-size: 25px; }
  .kpi-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-left: 0; border-top: 1px solid var(--line); padding: 16px; gap: 11px; }
  .kpi:nth-child(-n+2) { border-top: 0; }
  .kpi:nth-child(even) { border-left: 1px solid var(--line); }
  .kpi-ic { width: 38px; height: 38px; }
  .kpi strong { font-size: 22px; }
  .kpi span { white-space: normal; }
}
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.status-bars { display: grid; gap: 10px; }
.status-bar { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-weight: 500; font-size: 14px; text-decoration: none; color: inherit; padding: 4px 0; }
.status-bar .bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.status-bar .bar i { display: block; height: 100%; border-radius: 999px; }

/* ---------- Pedidos: filtros e lista (tabela) ---------- */
.filtros { display: grid; gap: 12px; margin-bottom: 16px; }
.filtros .linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.busca { position: relative; flex: 1 1 260px; }
.busca .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.busca .in { padding-left: 40px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--ink-2); transition: background .14s, color .14s, border-color .14s; }
.chip:hover { background: var(--surface-2); color: var(--ink); }
a.chip { text-decoration: none; }
.chk input.switch { width: 42px; height: 24px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); box-shadow: var(--glow); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; filter: var(--dot-filter); }
.chip.off { opacity: .55; }
.tabela { padding: 0; overflow: hidden; }
.tab-cab { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 16px; padding: 12px 22px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.tab-cab span:last-child { text-align: right; }
.tab-pe { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 22px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }
.tab-pe:empty, .tab-pe .mais:empty { display: none; }
.lista-ped { display: grid; }
.ped { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 14px 22px; cursor: pointer; color: inherit; transition: background .12s; }
.ped:first-child { border-top: 0; }
.ped:hover { background: var(--surface-2); }
.card > .lista-ped { margin: 0 -22px -22px; border-top: 1px solid var(--line); }
.card.tabela > .lista-ped { margin: 0; border-top: 0; }
.ped .quando { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.ped .quando small { display: block; font-family: var(--font-num); font-weight: 500; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.ped .quando.hoje { color: var(--rose-600); }
.ped .quando.atraso { color: var(--error); }
.ped .meio { min-width: 0; }
.ped .nome { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ped .cod { font-family: var(--font-num); font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
.ped .itens { color: var(--ink-2); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-top: 2px; }
.ped .dir { text-align: right; display: grid; gap: 5px; justify-items: end; }
.ped .total { font-weight: 600; font-size: 15px; }
@media (max-width: 640px) {
  .tab-cab { display: none; }
  .ped { grid-template-columns: minmax(0, 1fr) auto; padding: 13px 16px; }
  .card > .lista-ped { margin: 0 -16px -16px; }
  .ped .quando { grid-column: 1 / -1; display: flex; gap: 6px; align-items: baseline; }
  .ped .quando small { display: inline; margin: 0; }
  .tab-pe { padding: 12px 16px; }
}
/* Status vindo do cadastro (cor do banco): pílula tingida com ponto */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink); background: rgba(var(--c-rgb, 110, 75, 58), .14); box-shadow: inset 0 0 0 1px rgba(var(--c-rgb, 110, 75, 58), .28); }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c, #6E4B3A); filter: var(--dot-filter); flex: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.tag.pago { background: var(--teal-50); color: var(--teal); }
.tag.sinal { background: var(--warm-50); color: var(--gold); }
.tag.pend { background: var(--rose-50); color: var(--rose-600); }
.tag.cinza { background: var(--surface-2); color: var(--ink-2); }
.tag .ic { width: 13px; height: 13px; }
.vazio { text-align: center; padding: 40px 16px; color: var(--ink-2); }
.vazio h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
.mais { display: flex; justify-content: center; margin-top: 14px; }
.tab-pe .mais { margin: 0; }
.skel { height: 74px; border-radius: var(--r-sm); background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: brilho 1.2s infinite; }
.lista-ped .skel { margin: 12px 22px; height: 56px; }
@keyframes brilho { to { background-position: -200% 0; } }

/* ---------- Gaveta do pedido ---------- */
.veu { position: fixed; inset: 0; background: rgba(20, 10, 6, .45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
.veu.on { opacity: 1; pointer-events: auto; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); z-index: 51; background: var(--bg); box-shadow: var(--shadow-lg); border-left: 1px solid var(--line); transform: translateX(104%); transition: transform .28s var(--ease); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.gaveta.on { transform: none; }
.gav-h { display: flex; align-items: center; gap: 10px; min-height: var(--topbar); padding: 10px 14px 10px 18px; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.gav-h h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; flex: 1; min-width: 0; }
.gav-h small { display: block; font-family: var(--font-ui); font-size: 12.5px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; margin-top: 1px; }
.gav-b { flex: 1; overflow-y: auto; padding: 18px 18px calc(30px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
.gav-b .card { padding: 18px; box-shadow: var(--shadow-sm); }
.gav-b .card + .card { margin-top: 14px; }
.acoes-topo { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.modelos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.btn.wa:hover { background: #1A7A49; }
.status-sel { display: flex; flex-wrap: wrap; gap: 8px; }
.st-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; color: var(--ink); transition: background .14s; }
.st-btn:hover { background: var(--surface-2); }
.st-btn .dot { width: 9px; height: 9px; border-radius: 50%; filter: var(--dot-filter); }
.st-btn[aria-current="true"] { color: #fff; border-color: transparent; box-shadow: var(--shadow-sm); }
.st-btn[aria-current="true"] .dot { filter: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }
.prox { margin-top: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
.it { padding: 11px 0; border-bottom: 1px solid var(--line); }
.it:last-child { border-bottom: 0; }
.it-l { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.it-d { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.it-d b { color: var(--ink); }
.it-d.it-kit { margin-top: 6px; padding: 7px 10px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); border-left: 3px solid var(--teal); }
/* Imagem de referência do item (topper) */
.it-ref { display: flex; gap: 12px; align-items: center; margin-top: 8px; padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.it-ref-img { flex: none; display: block; width: 88px; height: 88px; border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.it-ref-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
.it-ref-img:hover img { transform: scale(1.05); }
.it-ref-acoes { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.it-ref-acoes > span { font-size: 12.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.it-ref.sem { justify-content: space-between; flex-wrap: wrap; border-style: dashed; border-color: rgba(var(--rose-rgb), .5); }
.it-ref.sem > span { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--rose-600); }
.it-ref.sem > span .ic { width: 16px; height: 16px; }
.topo-prev { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.topo-prev img { width: 96px; height: 96px; object-fit: cover; border-radius: 14px; flex: none; box-shadow: 0 0 0 1px var(--line); }
.topo-prev strong { display: block; font-size: 16px; }
.topo-prev small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.ed-ref { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.ed-ref img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
.ed-ref span { flex: 1; }
.hj-ref { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--teal); text-decoration: none; }
.hj-ref img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
.st-sinal { margin: 0 0 14px; }
.valores .lin { display: flex; justify-content: space-between; padding: 4px 0; font-weight: 500; }
.valores .lin.tot { font-family: var(--font-display); font-size: 20px; font-weight: 700; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.valores .lin.saldo { color: var(--rose-600); font-weight: 600; }
.valores .lin.quit { color: var(--teal); font-weight: 600; }
.pgto { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.pgto small { display: block; color: var(--ink-3); }
.obs { padding: 11px 13px; border-radius: var(--r-sm); background: var(--surface-2); margin-bottom: 8px; }
.obs.fix { background: var(--warm-50); box-shadow: inset 0 0 0 1px rgba(var(--gold-rgb), .35); }
.obs p { margin: 0; white-space: pre-wrap; }
.obs .meta { display: flex; align-items: center; gap: 6px; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.obs .meta .bt { display: flex; gap: 2px; }
.hist { list-style: none; padding: 0; margin: 0; }
.hist li { position: relative; padding: 0 0 16px 26px; font-size: 13.5px; }
.hist li::before { content: ''; position: absolute; left: 4px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--c, var(--teal)); filter: var(--dot-filter); box-shadow: 0 0 0 3px var(--surface); }
.hist li::after { content: ''; position: absolute; left: 9px; top: 19px; bottom: 0; width: 1px; background: var(--line-2); }
.hist li:last-child::after { display: none; }
.hist small { display: block; color: var(--ink-3); font-family: var(--font-num); font-size: 11.5px; margin-top: 1px; }
.hist em { display: block; font-style: normal; color: var(--ink-2); }
.cliente-obs { background: var(--warm-50); border-radius: var(--r-sm); padding: 11px 13px; margin-top: 12px; }

/* ---------- Modal ---------- */
.modal-veu { position: fixed; inset: 0; z-index: 70; background: rgba(20, 10, 6, .5); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; animation: aparece .18s var(--ease); }
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); animation: sobe .22s var(--ease); }
.modal.largo { width: min(840px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px 24px; border-bottom: 1px solid var(--line); }
.modal-h h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; flex: 1; }
.modal-b { padding: 20px 24px; overflow-y: auto; overscroll-behavior: contain; }
.modal-f { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 24px 18px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-xl) var(--r-xl); }
.modal-f .esq { margin-right: auto; }
@keyframes aparece { from { opacity: 0; } }
@media (max-width: 640px) {
  .modal-veu { padding: 0; place-items: end stretch; }
  .modal, .modal.largo { width: 100%; max-height: 94vh; border-radius: var(--r-xl) var(--r-xl) 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .modal-f { border-radius: 0; }
  .modal-f .btn { flex: 1; }
  .modal-f .esq { flex-basis: 100%; margin: 0; }
}

/* ---------- Toasts ---------- */
.toasts { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(460px, calc(100% - 24px)); }
@media (max-width: 991px) { .toasts { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
.toast { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-radius: 14px; background: #2A1A12; color: #FFF6EC; border: 1px solid rgba(255, 233, 214, .12); box-shadow: var(--shadow-lg); font-weight: 500; font-size: 14px; animation: sobe .22s var(--ease); }
.toast.erro { background: #8C1D18; }
.toast.novo { background: #9C3457; }
.toast .acao { margin-left: auto; background: rgba(255, 255, 255, .16); color: inherit; border: 0; border-radius: 10px; min-height: 34px; padding: 0 12px; font-weight: 600; cursor: pointer; }
@keyframes sobe { from { transform: translateY(10px); opacity: 0; } }

/* ---------- Cardápio ---------- */
.cat-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.cat-bar .chips { flex: 1 1 300px; }
.grupo { margin-bottom: 22px; }
.grupo-h { display: flex; align-items: center; gap: 10px; padding: 6px 4px 10px; flex-wrap: wrap; }
.grupo-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: -.015em; }
.grupo-h .info { color: var(--ink-3); font-size: 13px; }
.grupo-h .acts { margin-left: auto; display: flex; gap: 6px; }
.grupo.off .grupo-h h2 { opacity: .5; text-decoration: line-through; }
.prods { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.prod { display: grid; grid-template-columns: 52px minmax(0, 1fr) 180px auto auto; gap: 14px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); transition: background .12s; }
.prod:hover { background: var(--surface-2); }
.prod:first-child { border-top: 0; }
.prod.off .p-nome, .prod.off .thumb { opacity: .45; }
.thumb { width: 52px; height: 52px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.p-nome { min-width: 0; }
.p-nome strong { display: block; font-size: 14.5px; overflow-wrap: anywhere; }
.p-nome small { color: var(--ink-3); font-size: 12.5px; }
.p-nome .tag { margin-left: 6px; background: var(--rose-50); color: var(--rose-600); }
.preco-in { display: flex; align-items: center; gap: 6px; }
.preco-in .money { flex: 1; }
.preco-in .in { min-height: 38px; padding-top: 6px; padding-bottom: 6px; text-align: right; font-weight: 500; }
.preco-in small { color: var(--ink-3); font-size: 12px; min-width: 26px; white-space: nowrap; }
.preco-in .in.salvo { border-color: var(--teal); background: var(--teal-50); }
@media (max-width: 720px) {
  .prod { grid-template-columns: 52px minmax(0, 1fr) auto; padding: 11px 14px; }
  .prod .preco-in { grid-column: 2 / 3; }
  .prod .sw { grid-row: 1; grid-column: 3; }
  .prod .ed { grid-column: 3; grid-row: 2; }
}

/* ---------- Ajustes ---------- */
.sub-tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 18px; padding: 4px; width: fit-content; max-width: 100%; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); scrollbar-width: none; }
.sub-tabs::-webkit-scrollbar { display: none; }
.sub-tabs a { padding: 8px 15px; border-radius: 10px; font-weight: 600; font-size: 13.5px; color: var(--ink-3); text-decoration: none; white-space: nowrap; transition: background .14s, color .14s; }
.sub-tabs a:hover { color: var(--ink); }
.sub-tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--line); }
.tbl { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.tbl .r { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-top: 1px solid var(--line); transition: background .12s; }
.tbl .r:hover { background: var(--surface-2); }
.tbl .r:first-child { border-top: 0; }
.tbl .r .main { flex: 1; min-width: 0; }
.tbl .r .main strong { display: block; overflow-wrap: anywhere; }
.tbl .r .main small { color: var(--ink-3); display: block; }
.tbl .r.off .main { opacity: .5; }
.ban-img { width: 84px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--surface-2); flex: none; }
.cor { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
.pausa { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: var(--r); margin-bottom: 18px; border: 1px solid var(--line); }
.pausa.on { background: var(--teal-50); border-color: rgba(var(--teal-rgb), .25); }
.pausa.off { background: var(--rose-50); border-color: rgba(var(--rose-rgb), .25); }
.pausa strong { display: block; font-family: var(--font-display); font-size: 17px; letter-spacing: -.01em; }
.pausa span { color: var(--ink-2); font-size: 13.5px; }
.foto-campo { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.foto-campo .prev { width: 96px; height: 96px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--ink-3); font-size: 12px; font-weight: 500; text-align: center; box-shadow: inset 0 0 0 1px var(--line); }
.foto-campo .prev img { width: 100%; height: 100%; object-fit: cover; }
.foto-campo .bt { display: flex; gap: 8px; flex-wrap: wrap; }
.faixas .fx { display: grid; grid-template-columns: 1.2fr .8fr .8fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
.faixas .fx .field { margin: 0; }
@media (max-width: 560px) { .faixas .fx { grid-template-columns: 1fr 1fr; } }
.secao-t { font-family: var(--font-ui); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin: 20px 0 10px; }
.secao-t.linha { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; }   /* seções de Ajustes > Loja */
.ajuste-dica { font-size: 12.5px; color: var(--ink-3); margin: -6px 0 14px; }
.aviso-box { padding: 12px 14px; border-radius: var(--r-sm); background: var(--warm-50); font-size: 13.5px; margin-bottom: 14px; }
.aviso-box code { background: var(--surface); padding: 1px 6px; border-radius: 6px; font-family: var(--font-num); font-size: 12px; }

/* ---------- Filtros da lista de pedidos ---------- */
.filtros .linha[hidden], .f-mais[hidden] { display: none; }
.f-cont { margin-left: 6px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--teal); color: var(--on-teal); font-size: 11.5px; font-weight: 700; }
.f-cont[hidden] { display: none; }
.f-datas { gap: 8px; }
.f-datas .in { width: auto; min-height: 40px; }
.f-prox .ic { transform: rotate(180deg); }
.f-dia-nome { font-weight: 600; color: var(--ink-2); }
.f-de { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.dias-ret { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.dia-ret { flex: none; display: grid; justify-items: center; align-content: center; gap: 1px; min-width: 70px; padding: 7px 8px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; font: inherit; transition: background .14s, border-color .14s; }
.dia-ret:hover { background: var(--surface-2); }
.dia-ret .dr-sem { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.dia-ret.domingo .dr-sem { color: var(--rose-600); }
.dia-ret b { font-family: var(--font-num); font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.dia-ret .dr-n { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.dia-ret.outro { min-width: 92px; gap: 4px; }
.dia-ret.outro .ic { width: 18px; height: 18px; }
.dia-ret[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: var(--glow); }
.dia-ret[aria-pressed="true"] b, .dia-ret[aria-pressed="true"] .dr-n, .dia-ret[aria-pressed="true"] .dr-sem { color: inherit; }
.f-mais { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
.f-mais .field { margin: 0; }
.f-mais .sel:disabled { opacity: .55; }
@media (max-width: 760px) { .f-mais { grid-template-columns: 1fr 1fr; } }
.tab-pe .link { font-size: 13px; margin-left: 6px; }

/* ---------- Estoque ---------- */
.est-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.est-kpi { display: grid; gap: 2px; text-align: left; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; color: var(--ink); font: inherit; }
.est-kpi strong { font-family: var(--font-num); font-size: 26px; font-weight: 700; line-height: 1.1; }
.est-kpi span { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.est-kpi.sinal strong { color: var(--gold); }
.est-kpi.pend strong { color: var(--rose-600); }
.est-kpi[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(var(--teal-rgb), .18); }
.est-grupo + .est-grupo { margin-top: 16px; }
.est-cab { display: flex; align-items: center; gap: 10px; padding: 13px 22px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.est-cab h2 { font-size: 14.5px; font-weight: 700; margin: 0; flex: 1; }
.est-linha { display: grid; grid-template-columns: minmax(0, 1fr) 92px 104px auto; gap: 8px 16px; align-items: center; padding: 10px 14px 10px 22px; border-top: 1px solid var(--line); }
.est-linha:first-child { border-top: 0; }
.est-nome { display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; cursor: pointer; min-width: 0; }
.est-nome strong { font-size: 15px; font-weight: 600; }
.est-nome small { font-size: 12.5px; color: var(--ink-3); }
.est-nome:hover strong { text-decoration: underline; text-underline-offset: 3px; }
.est-qtd { text-align: right; line-height: 1.15; }
.est-qtd b { font-family: var(--font-num); font-size: 19px; font-weight: 700; }
.est-qtd small { display: block; font-size: 12px; color: var(--ink-3); }
.est-linha.acabando .est-qtd b { color: var(--gold); }
.est-linha.acabou .est-qtd b { color: var(--rose-600); }
.est-linha.pausado { opacity: .65; }
.est-linha > .tag { justify-self: center; }
.est-bts { display: flex; gap: 4px; }
@media (max-width: 640px) {
  .est-linha { grid-template-columns: minmax(0, 1fr) auto; padding: 12px 14px; }
  .est-linha > .tag { justify-self: start; }
  .est-bts { justify-self: end; }
  .est-kpis { gap: 8px; }
  .est-kpi { padding: 10px 12px; }
  .est-kpi strong { font-size: 21px; }
}
.est-cons { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.est-cons [hidden] { display: none !important; }
.est-cons-q { display: flex; align-items: center; gap: 6px; }
.est-cons-q .in { width: 76px; text-align: right; }
.est-cons-q > span:last-child { min-width: 54px; color: var(--ink-2); font-weight: 600; font-size: 13.5px; }
.est-cons-g, .est-cons-cada { color: var(--ink-3); font-size: 13.5px; white-space: nowrap; }
.est-cons .sel[data-cons-base] { width: auto; }
@media (max-width: 560px) {
  .est-cons { grid-template-columns: minmax(0, 1fr) auto; padding-bottom: 8px; border-bottom: 1px dashed var(--line-2); }
  .est-cons [data-cons-prod] { grid-column: 1 / -1; }
}
.est-un-in { display: flex; align-items: center; gap: 8px; }
.est-un-in .in { flex: 1; min-width: 0; }
.est-un-in span { color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.est-atual { margin: 0; font-size: 14px; color: var(--ink-2); }
.est-tipos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
.est-tipo { position: relative; display: block; cursor: pointer; }
.est-tipo input { position: absolute; opacity: 0; pointer-events: none; }
.est-tipo > span { display: grid; gap: 2px; height: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); }
.est-tipo small { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.est-tipo input:checked + span { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(var(--teal-rgb), .18); background: rgba(var(--teal-rgb), .06); }
.est-tipo input:focus-visible + span { outline: 3px solid rgba(var(--teal-rgb), .45); outline-offset: 1px; }
@media (max-width: 560px) { .est-tipos { grid-template-columns: 1fr; } }
.est-topo { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.est-grande b { font-family: var(--font-num); font-size: 40px; font-weight: 700; line-height: 1; }
.est-grande span { margin-left: 6px; font-size: 16px; color: var(--ink-2); font-weight: 600; }
.est-topo .dica { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); }
.est-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }
.est-ligados { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }
.est-obs { margin: 0; white-space: pre-line; font-size: 14px; }
.est-hist { list-style: none; margin: 0; padding: 0; }
.est-hist li { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.est-hist li:first-child { border-top: 0; }
.est-h-q { font-family: var(--font-num); font-weight: 700; text-align: right; }
.est-hist li.mais .est-h-q { color: var(--teal); }
.est-hist li.menos .est-h-q { color: var(--rose-600); }
.est-h-t small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 1px; }

/* ---------- Impressão automática (Minha conta) ---------- */
.imp-auto { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface-2); }
.imp-linha { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.imp-linha .sel { flex: 1; min-height: 38px; }
.imp-auto .dica { font-size: 12px; line-height: 1.45; color: var(--ink-3); margin: 0; }
.imp-auto code { background: var(--surface); padding: 1px 5px; border-radius: 6px; font-family: var(--font-num); font-size: 11.5px; }

/* ---------- Avisos (sino da barra de cima) ---------- */
.topo-bt[hidden] { display: none; }
.topo-badge { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; display: grid; place-items: center; background: var(--rose-600); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 1; box-shadow: 0 0 0 2px var(--surface); }
.topo-badge[hidden] { display: none; }
.avisos-menu { width: min(370px, calc(100vw - 16px)); max-height: min(72vh, 540px); overflow-y: auto; }
.av-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-right: 8px; }
.tema-menu .av-cab .link { width: auto; padding: 4px 0; font-size: 12.5px; color: var(--teal); }
.tema-menu .aviso-it { align-items: flex-start; }
.tema-menu .aviso-it > .ic { visibility: visible; flex: none; margin-top: 2px; color: var(--ink-3); }
.tema-menu .aviso-it.novo { background: rgba(var(--teal-rgb), .08); }
.tema-menu .aviso-it.novo > .ic { color: var(--teal); }
.tema-menu .aviso-it.novo:hover { background: rgba(var(--teal-rgb), .14); }
.aviso-it strong { display: flex; align-items: center; gap: 6px; }
.aviso-it small { color: var(--ink-2) !important; line-height: 1.4; margin-top: 2px; }
.aviso-it em { display: block; font-style: normal; font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.av-ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--rose-600); flex: none; }
.av-vazio { margin: 0; padding: 12px 10px 14px; color: var(--ink-3); font-size: 13.5px; }

/* ---------- Topos e personalizados ---------- */
.vista-sel { display: inline-flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.vista-sel .btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.tq { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; align-items: start; overflow-x: auto; padding-bottom: 6px; }
.tq-col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; min-width: 0; }
.tq-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; }
.tq-h .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); filter: var(--dot-filter); flex: none; }
.tq-h h2 { font-size: 14.5px; font-weight: 700; flex: 1; margin: 0; }
.tq-n { font-family: var(--font-num); font-weight: 700; font-size: 13px; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center; background: rgba(var(--c-rgb), .18); color: var(--ink); }
.tq-cards { display: grid; gap: 10px; min-height: 90px; border-radius: var(--r-sm); transition: background .15s, box-shadow .15s; }
.tq-cards.sobre { background: rgba(var(--c-rgb), .10); box-shadow: inset 0 0 0 2px rgba(var(--c-rgb), .55); }
.tq-vazio { margin: 0; padding: 22px 8px; text-align: center; color: var(--ink-3); font-size: 13px; }

.tq-card[draggable="true"] { cursor: grab; }
.tq-abrir { display: grid; gap: 4px; text-align: left; padding: 10px 12px; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
.tq-abrir:hover { background: var(--surface-2); }
.tq-img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 4px; background: var(--surface-2); }
.tq-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tq-cod { font-family: var(--font-num); font-size: 12px; color: var(--ink-3); font-weight: 600; }
.tq-tit { font-size: 15px; font-weight: 700; line-height: 1.3; }
.tq-l { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.tq-l b { font-weight: 600; }
.tq-txt { font-weight: 600; color: var(--ink); }
.tq-cli { color: var(--ink-3); font-size: 12.5px; }
.tq-quando { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tq-quando .ic { width: 14px; height: 14px; flex: none; }
.tq-quando.hoje { color: var(--rose-600); }
.tq-quando.amanha { color: var(--gold); }
.tq-quando.atraso { color: var(--error); }
.tq-avancar { margin: 0 10px 10px; justify-content: center; }
.tag.tp-pers { background: var(--teal-50); color: var(--teal); }
.it-topo { display: flex; flex-wrap: wrap; gap: 6px; }
.it-topo:empty { display: none; }
.it-topo .pill { padding: 1px 8px 1px 6px; }
.tp-refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.tp-refs a { display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.tp-refs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tf-refs { display: flex; flex-wrap: wrap; gap: 8px; }
.tf-ref { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.tf-ref img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tf-ref .btn { position: absolute; top: 4px; right: 4px; min-height: 0; width: 26px; height: 26px; padding: 0; background: rgba(0, 0, 0, .6); color: #fff; border: 0; }
.tf-add { width: 84px; height: 84px; border-radius: 10px; border: 1px dashed var(--line-2); display: grid; place-content: center; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; text-align: center; padding: 4px; }
.tf-add:hover { background: var(--surface-2); }

.tq-tvbar { display: none; }
@media (max-width: 760px) {
  .tq { grid-template-columns: repeat(4, 84%); scroll-snap-type: x mandatory; }
  .tq-col { scroll-snap-align: start; }
}
/* tela cheia (TV na bancada) */
body.tv-topos .side, body.tv-topos .topo, body.tv-topos .rodape, body.tv-topos .nav-mob, body.tv-topos .page-head { display: none !important; }

body.tv-topos main.conteudo { max-width: none; padding: 16px 20px; }
body.tv-topos .tq-tvbar { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
body.tv-topos .tq-tvbar strong { font-family: var(--font-display); font-size: 26px; font-weight: 600; flex: 1; }
body.tv-topos .tq-tvbar span { font-family: var(--font-num); font-size: 20px; font-weight: 600; color: var(--ink-2); }
body.tv-topos .tq { grid-template-columns: repeat(4, minmax(0, 1fr)); }
