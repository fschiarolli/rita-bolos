<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#140D09">
<title>Quadro da equipe — Rita Bolos</title>
<script>
  /* Só na demonstração: ?demo&hora=10:05 simula o relógio, para ver como o quadro fica em outro horário do dia. */
  (() => {
    const q = new URLSearchParams(location.search), h = q.get('hora');
    if (!q.has('demo') || !/^\d{1,2}:\d{2}$/.test(h || '')) return;
    const D = Date, inicio = D.now(), hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new D());
    const [hh, mm] = h.split(':');
    const fixo = new D(`${hoje}T${hh.padStart(2, '0')}:${mm}:00-03:00`).getTime();
    class Relogio extends D {
      constructor(...a) { if (a.length) super(...a); else super(fixo + (D.now() - inicio)); }
      static now() { return fixo + (D.now() - inicio); }
    }
    window.Date = Relogio;
  })();
</script>
<script>
  /* Tema: o mesmo escolhido no backoffice deste aparelho (o Canela tem versão própria do quadro).
     ?tema=canela no endereço força o Canela; ?tema=escuro, o quadro escuro de sempre. */
  (() => {
    let t = new URLSearchParams(location.search).get('tema');
    if (!t) { try { t = localStorage.getItem('ritabolos.tema'); } catch (e) { t = null; } }
    if (t !== 'canela') return;
    document.documentElement.setAttribute('data-theme', 'canela');
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#FFF4CC');
    const f = document.createElement('link'); f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,0..100&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap'; document.head.appendChild(f);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/*
  Quadro da equipe: feito para TV (1920×1080), visto de longe e sem ninguém mexer.
  Tudo é medido em rem e o rem acompanha o tamanho da tela, então o desenho é
  o mesmo em HD, Full HD ou 4K. No celular vira uma lista que rola.
*/
:root {
  --bg: #140D09; --surface: #1E1510; --surface-2: #2A1D16; --surface-3: #362619;
  --line: rgba(255, 233, 214, .08); --line-2: rgba(255, 233, 214, .16);
  --ink: #FBF1E6; --ink-2: #DDC8B5; --ink-3: #B39883;
  --critical: #FF8676; --critical-bg: rgba(255, 112, 94, .15); --critical-line: rgba(255, 134, 118, .5);
  --warning: #F5B850; --warning-bg: rgba(245, 184, 80, .14);
  --good: #8ED9A9; --good-bg: rgba(142, 217, 169, .13);
  --brand: #F4AFC2; --brand-bg: rgba(244, 175, 194, .15);
  --gold: #E8C886; --gold-bg: rgba(232, 200, 134, .12);
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'Manrope', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 1rem; --r-sm: .75rem; --gap: .9rem;
  color-scheme: dark;
  font-size: 16px;
  font-size: min(1.0417vw, 1.852vh);   /* 20px em 1920×1080 */
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-ui); font-size: 1rem; line-height: 1.3; color: var(--ink);
  background:
    radial-gradient(70rem 36rem at -5% -20%, rgba(232, 144, 168, .08), transparent 65%),
    radial-gradient(60rem 30rem at 105% -15%, rgba(125, 196, 176, .06), transparent 60%),
    var(--bg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden;
}
body.ocioso, body.ocioso * { cursor: none !important; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.ic { width: 1.2em; height: 1.2em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Estrutura ---------- */
/* linhas fixas: com a faixa de erro escondida, o painel continua ocupando o resto da tela */
.quadro { height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); padding: 1rem 1.4rem 1.1rem; }
.quadro > .topo { grid-row: 1; }
.quadro > .faixa-erro { grid-row: 2; margin-top: 1rem; }
.quadro > .painel { grid-row: 3; margin-top: 1rem; }
.topo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.2rem; align-items: stretch; }

.marca { display: grid; grid-template-columns: auto auto; justify-content: start; align-items: center; column-gap: .85rem; }
.marca img { width: 4rem; height: 4rem; display: block; filter: drop-shadow(0 .4rem 1rem rgba(0, 0, 0, .35)); }
.marca strong { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
.marca span { display: block; margin-top: .2rem; font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }

/* ---------- Números do dia ---------- */
.kpis { display: grid; grid-template-columns: minmax(0, 2.5fr) repeat(3, minmax(0, 1fr)); gap: .8rem; }
.kpi { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .7rem; align-items: center; padding: .8rem .9rem; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.kpi-ic { width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); }
.kpi-ic .ic { width: 1.2rem; height: 1.2rem; }
.kpi-rot { font-size: .8rem; font-weight: 600; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-val { font-size: 2.2rem; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
.kpi-sub { font-size: .78rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .1rem; }
.kpi.critico { border-color: var(--critical-line); background: linear-gradient(var(--critical-bg), var(--critical-bg)), var(--surface); }
.kpi.critico .kpi-ic { background: var(--critical-bg); color: var(--critical); }
.kpi.aviso .kpi-ic { background: var(--warning-bg); color: var(--warning); }
.kpi.bom .kpi-ic { background: var(--good-bg); color: var(--good); }

/* Retiradas de hoje: rótulo e resumo em cima; número + barra por status embaixo */
.kpi-hoje { grid-template-columns: auto minmax(0, 1fr); column-gap: 1.1rem; row-gap: .3rem; align-items: center; }
.kpi-hoje .kpi-cab { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; min-width: 0; }
.kpi-hoje .kpi-meta { margin-left: .8rem; font-size: .78rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hoje-graf { min-width: 0; display: grid; gap: .45rem; }
.barra { display: flex; height: 1.15rem; border-radius: .2rem; overflow: hidden; background: var(--surface-3); }
.seg { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; font-size: .72rem; font-weight: 800; }
.seg + .seg { margin-left: 2px; }
.seg b { padding: 0 .25rem; white-space: nowrap; }
.legenda { display: flex; flex-wrap: wrap; margin: -.15rem 0 0 -.75rem; font-size: .72rem; color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; margin: .15rem 0 0 .75rem; white-space: nowrap; }
.legenda i { width: .6rem; height: .6rem; border-radius: 50%; margin-right: .35rem; flex: none; }
.legenda b { margin-left: .3rem; color: var(--ink); font-weight: 700; }

/* ---------- Relógio e conexão ---------- */
.agora { display: grid; align-content: center; justify-items: end; text-align: right; min-width: 10rem; }
.agora .data { font-size: .9rem; font-weight: 600; color: var(--ink-2); }
.agora .hora { font-size: 3.1rem; font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin: .1rem 0 .3rem; }
.conexao { display: inline-flex; align-items: center; font-size: .74rem; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
.conexao i { width: .55rem; height: .55rem; border-radius: 50%; margin-right: .45rem; background: var(--ink-3); }
.conexao.vivo i { background: var(--good); animation: vivo 2.2s infinite; }
.conexao.vivo strong { color: var(--good); }
.conexao.lento i { background: var(--warning); }
.conexao.lento strong { color: var(--warning); }
.conexao.fora i { background: var(--critical); }
.conexao.fora strong { color: var(--critical); }
.conexao strong { font-weight: 700; margin-right: .3rem; }
.selo-demo { margin-left: .5rem; padding: .1rem .45rem; border-radius: 999px; background: var(--brand-bg); color: var(--brand); font-size: .64rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

.faixa-erro { display: flex; align-items: center; gap: .6rem; padding: .6rem 1rem; border-radius: var(--r-sm); background: var(--warning-bg); border: 1px solid rgba(245, 184, 80, .35); color: var(--warning); font-size: .9rem; font-weight: 600; }

/* ---------- Colunas por status ---------- */
.painel { display: grid; grid-template-columns: repeat(var(--colunas, 4), minmax(0, 1fr)) minmax(16rem, 21rem); gap: var(--gap); min-height: 0; }
.coluna, .producao {
  position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0;
  border-radius: var(--r); border: 1px solid var(--line); overflow: hidden;
  background: linear-gradient(180deg, rgba(var(--cor-rgb, 232, 200, 134), .13), rgba(var(--cor-rgb, 232, 200, 134), .03) 7rem, transparent 14rem), var(--surface);
}
.coluna::before, .producao::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: .32rem; background: var(--cor, var(--gold)); }
.col-topo { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; column-gap: .6rem; padding: 1rem 1rem .75rem; }
.col-nome { display: flex; align-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.005em; line-height: 1.15; min-width: 0; }
.col-nome i { width: .75rem; height: .75rem; border-radius: 50%; background: var(--cor); margin-right: .55rem; flex: none; box-shadow: 0 0 0 .22rem rgba(var(--cor-rgb), .22); }
.col-nome span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col-qtd { font-size: 2.1rem; font-weight: 800; line-height: .95; letter-spacing: -.02em; }
.col-resumo { grid-column: 1 / -1; margin-top: .35rem; font-size: .8rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col-resumo b { color: var(--critical); font-weight: 700; }
.col-resumo em { color: var(--warning); font-style: normal; font-weight: 700; }

.rolo { position: relative; overflow: hidden; min-height: 0; padding: 0 .75rem; }
.trilho { display: grid; gap: .7rem; padding-bottom: .75rem; transition: transform .8s cubic-bezier(.22, .8, .24, 1); will-change: transform; }
.col-pe { display: flex; align-items: center; justify-content: space-between; min-height: 2.1rem; padding: .35rem 1rem .6rem; font-size: .76rem; color: var(--ink-3); }
.col-futuros { min-width: 0; margin-right: .6rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pag { display: inline-flex; flex: none; align-items: center; margin-left: auto; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pag-barra { position: relative; width: 3.2rem; height: .22rem; margin-left: .55rem; border-radius: 1rem; background: var(--surface-3); overflow: hidden; }
.pag-barra i { position: absolute; top: 0; left: 0; bottom: 0; width: 100%; background: var(--ink-2); transform-origin: left center; transform: scaleX(0); }

/* ---------- Cartão do pedido ---------- */
.cartao { position: relative; display: grid; gap: .5rem; padding: .8rem .9rem .85rem; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 .45rem 1.2rem rgba(0, 0, 0, .2); transition: opacity .5s ease; }
.cartao.fora { opacity: 0; }
.cartao.atrasado { border-color: var(--critical-line); background: linear-gradient(var(--critical-bg), var(--critical-bg)), var(--surface-2); box-shadow: inset .3rem 0 0 var(--critical), 0 .45rem 1.2rem rgba(0, 0, 0, .2); }
.cartao.em-breve, .cartao.esperando { box-shadow: inset .3rem 0 0 var(--warning), 0 .45rem 1.2rem rgba(0, 0, 0, .2); }
.cartao.novo { border-color: rgba(244, 175, 194, .7); box-shadow: 0 0 0 1px rgba(244, 175, 194, .5), 0 0 1.6rem rgba(244, 175, 194, .22); animation: brilho 1.8s ease-out 3; }
.cartao.mudou { animation: chegou 2.6s ease-out; }
.c-cab { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .8rem; align-items: center; }
.c-quando { display: grid; justify-items: start; min-width: 4.2rem; }
.c-hora { font-size: 1.65rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.c-hora.sem { font-size: 1.05rem; font-weight: 700; color: var(--ink-2); letter-spacing: 0; }
.c-dia { margin-top: .22rem; font-size: .7rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.c-quem { min-width: 0; padding-left: .8rem; border-left: 1px solid var(--line-2); }
.c-nome { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 1.06rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.c-cod { display: block; margin-top: .15rem; font-size: .74rem; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.c-fichas, .c-pag { display: flex; flex-wrap: wrap; margin: -.3rem 0 0 -.35rem; }
.c-fichas > *, .c-pag > * { margin: .3rem 0 0 .35rem; }
.c-itens { list-style: none; margin: 0; padding: .55rem 0 0; border-top: 1px solid var(--line); display: grid; gap: .35rem; }
.c-item { display: grid; grid-template-columns: minmax(2.1rem, auto) minmax(0, 1fr); column-gap: .3rem; align-items: baseline; }
.c-qtd { font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: .95rem; }
.c-prod { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: .95rem; font-weight: 500; line-height: 1.25; }
.c-peso { font-weight: 800; white-space: nowrap; }
.c-det { display: block; margin-top: .1rem; font-size: .78rem; color: var(--ink-3); line-height: 1.3; }
.c-kit { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: .15rem; font-size: .8rem; font-weight: 600; color: var(--ink-2); line-height: 1.3; overflow-wrap: anywhere; }
.c-iobs { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: .15rem; font-size: .8rem; font-style: italic; color: var(--ink-2); line-height: 1.3; overflow-wrap: anywhere; }
.c-ref { display: flex; align-items: center; gap: .45rem; margin-top: .3rem; font-size: .75rem; font-weight: 700; color: var(--ink-2); }
.c-ref img { width: 2.4rem; height: 2.4rem; object-fit: cover; border-radius: .45rem; }
.c-mais { padding-left: 2.1rem; font-size: .78rem; font-weight: 700; color: var(--ink-3); }
.c-nota, .c-obs { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .4rem; align-items: start; font-size: .8rem; line-height: 1.3; }
.c-nota { padding: .4rem .55rem; border-radius: .5rem; background: var(--gold-bg); color: var(--gold); font-weight: 600; }
.c-obs { color: var(--ink-2); }
.c-nota .ic, .c-obs .ic { width: .95rem; height: .95rem; margin-top: .05rem; }
.c-nota span, .c-obs span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.ficha { display: inline-flex; align-items: center; height: 1.55rem; padding: 0 .62rem; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.ficha .ic { width: .95rem; height: .95rem; margin-right: .32rem; stroke-width: 2.4; }
.ficha.critico { color: var(--critical); background: var(--critical-bg); animation: pulso 2.6s ease-in-out infinite; }
.ficha.aviso { color: var(--warning); background: var(--warning-bg); }
.ficha.bom { color: var(--good); background: var(--good-bg); }
.ficha.marca { color: var(--brand); background: var(--brand-bg); }

/* Divisão por período dentro da coluna (manhã, tarde...), quando há muitos pedidos */
.grupo { display: flex; align-items: center; gap: .45rem; padding: .3rem .15rem 0; font-size: .68rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); transition: opacity .5s ease; }
.grupo:first-child { padding-top: 0; }
.grupo b { color: var(--ink-2); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.grupo::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
.grupo.fora { opacity: 0; }

/* ---------- Cartões compactos: o quadro liga sozinho quando as colunas não cabem (dias de muitos pedidos) ---------- */
.painel.compacto .trilho { gap: .45rem; }
.painel.compacto .cartao { gap: .3rem; padding: .5rem .7rem .55rem; }
.painel.compacto .c-cab { column-gap: .6rem; }
.painel.compacto .c-quando { min-width: 0; display: flex; align-items: baseline; gap: .4rem; }
.painel.compacto .c-hora { font-size: 1.3rem; }
.painel.compacto .c-hora.sem { font-size: .85rem; }
.painel.compacto .c-dia { margin: 0; font-size: .62rem; }
.painel.compacto .c-quem { display: flex; align-items: baseline; gap: .5rem; padding-left: .6rem; }
.painel.compacto .c-nome { flex: 1; min-width: 0; -webkit-line-clamp: 1; font-size: 1rem; }
.painel.compacto .c-cod { display: none; }   /* o nome importa mais que o código na TV */
.painel.compacto .c-itens { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-top: .3rem; font-size: .86rem; line-height: 1.32; }
.painel.compacto .c-item, .painel.compacto .c-item > span { display: inline; }
.painel.compacto .c-item + .c-item::before, .painel.compacto .c-mais::before { content: '·'; margin: 0 .35rem; color: var(--ink-3); font-weight: 800; }
.painel.compacto .c-qtd { margin-right: .2rem; font-size: inherit; }
.painel.compacto .c-prod { display: inline; font-size: inherit; }
.painel.compacto .c-det, .painel.compacto .c-iobs, .painel.compacto .c-kit { display: none; }
.painel.compacto .c-ref { display: inline; margin: 0 0 0 .3rem; font-size: 0; }
.painel.compacto .c-ref img { width: 1.2rem; height: 1.2rem; border-radius: .25rem; vertical-align: -.25rem; }
.painel.compacto .c-mais { display: inline; padding: 0; font-size: inherit; }
.painel.compacto .c-nota, .painel.compacto .c-obs { font-size: .74rem; }
.painel.compacto .c-nota { padding: .22rem .45rem; }
.painel.compacto .c-nota span, .painel.compacto .c-obs span { -webkit-line-clamp: 1; }
.painel.compacto .ficha { height: 1.35rem; padding: 0 .5rem; font-size: .7rem; }
/* Nível mínimo (ainda mais pedidos): hora, nome e itens numa linha; o atraso fica na borda colorida do cartão */
.painel.mini .trilho { gap: .35rem; }
.painel.mini .cartao { gap: .18rem; padding: .38rem .65rem .42rem; }
.painel.mini .c-hora { font-size: 1.12rem; }
.painel.mini .c-nome { font-size: .95rem; }
.painel.mini .c-itens { -webkit-line-clamp: 1; padding-top: .2rem; font-size: .82rem; }
.painel.mini .c-fichas, .painel.mini .c-obs { display: none; }   /* o valor a receber (c-pag) fica: quem entrega precisa dele */
.painel.mini .c-nota { padding: .14rem .4rem; font-size: .7rem; }
.painel.mini .grupo { padding-top: .15rem; }

.vazio { display: grid; justify-items: center; align-content: center; gap: .55rem; height: 100%; min-height: 9rem; padding: 1rem; text-align: center; color: var(--ink-3); font-size: .86rem; }
.vazio .ic { width: 2.2rem; height: 2.2rem; stroke-width: 1.6; opacity: .7; }

/* ---------- Produção (o que fazer hoje; com ?dias=2 ou mais, também amanhã) ---------- */
.producao { --cor: linear-gradient(90deg, #E8C886, #F4AFC2); }
.prod-sub { grid-column: 1 / -1; margin-top: .35rem; font-size: .8rem; color: var(--ink-3); }
.p-dia + .p-dia { margin-top: 1.1rem; }
.p-dia-cab { display: flex; align-items: baseline; justify-content: space-between; padding: .2rem 0 .45rem; border-bottom: 1px solid var(--line-2); }
.p-dia-cab strong { font-family: var(--font-display); font-weight: 800; font-size: 1.08rem; }
.p-dia-cab span { font-size: .76rem; font-weight: 600; color: var(--ink-3); }
.p-cat { padding: .7rem 0 .2rem; font-size: .66rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
.p-linha { display: grid; grid-template-columns: 3rem minmax(0, 1fr); column-gap: .6rem; align-items: baseline; padding: .42rem 0; border-bottom: 1px solid var(--line); }
.p-qtd { text-align: right; font-size: 1.3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.p-qtd small { font-size: .7em; color: var(--ink-3); margin-left: .05rem; font-weight: 700; }
.p-nome { font-size: .92rem; font-weight: 600; line-height: 1.25; }
.p-det { display: block; font-size: .76rem; font-weight: 400; color: var(--ink-3); margin-top: .1rem; }
.p-obs { display: block; font-size: .78rem; font-weight: 400; font-style: italic; color: var(--ink-2); margin-top: .1rem; }
.p-nota { margin-top: .6rem; font-size: .78rem; color: var(--ink-3); }
.p-nota b { color: var(--ink-2); }

/* ---------- Aviso de pedido novo ---------- */
.novidade { position: fixed; left: 50%; bottom: 2rem; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 1rem; align-items: center; width: max-content; max-width: min(46rem, calc(100vw - 2rem)); padding: 1rem 1.5rem 1rem 1rem; border-radius: 1.2rem; background: #3A2619; border: 1px solid rgba(244, 175, 194, .45); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .55), 0 0 3rem rgba(244, 175, 194, .15); transform: translate(-50%, 160%); opacity: 0; transition: transform .6s cubic-bezier(.2, .9, .25, 1.15), opacity .4s; }
.novidade.on { transform: translate(-50%, 0); opacity: 1; }
.novidade-ic { width: 3.2rem; height: 3.2rem; border-radius: 50%; display: grid; place-items: center; background: var(--brand-bg); color: var(--brand); }
.novidade-ic .ic { width: 1.7rem; height: 1.7rem; }
.novidade-txt strong { display: block; font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; line-height: 1.15; }
.novidade-txt span { display: block; margin-top: .2rem; font-size: .95rem; color: var(--ink-2); }

/* ---------- Controles (aparecem quando o mouse mexe) ---------- */
.controles { position: fixed; right: 1.4rem; bottom: 1.2rem; z-index: 15; display: flex; padding: .35rem; border-radius: 999px; background: rgba(54, 38, 25, .92); border: 1px solid var(--line-2); box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, .45); transition: opacity .3s, transform .3s; }
body.ocioso .controles { opacity: 0; transform: translateY(.5rem); pointer-events: none; }
.controles button, .controles a { display: inline-flex; align-items: center; min-height: 2.3rem; padding: 0 .9rem; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font-size: .8rem; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; }
.controles button + *, .controles a + * { margin-left: .2rem; }
.controles .ic { width: 1.05rem; height: 1.05rem; margin-right: .45rem; }
.controles button:hover, .controles a:hover { background: rgba(255, 233, 214, .1); }
.controles [aria-pressed="false"] { color: var(--ink-3); }
:focus-visible { outline: .18rem solid var(--brand); outline-offset: .15rem; }

/* ---------- Entrada (login) e estados de tela inteira ---------- */
.entrada { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; overflow: auto; }
.entrada-card { width: min(100%, 26rem); display: grid; gap: .9rem; justify-items: stretch; padding: 2rem; border-radius: 1.4rem; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 2rem 5rem rgba(0, 0, 0, .45); text-align: center; }
.entrada-card img { justify-self: center; width: 7rem; height: 7rem; }
.entrada-card h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; }
.entrada-card p { margin: 0; color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.entrada-card label { display: grid; gap: .35rem; text-align: left; font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.entrada-card input { min-height: 2.9rem; padding: 0 .9rem; border-radius: .7rem; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); font-size: 1rem; }
.entrada-card button { min-height: 3rem; border: 0; border-radius: 999px; background: var(--ink); color: #2A1A12; font-weight: 800; font-size: 1rem; cursor: pointer; }
.entrada-card button[disabled] { opacity: .6; cursor: progress; }
.entrada-erro { padding: .6rem .8rem; border-radius: .7rem; background: var(--critical-bg); color: var(--critical); font-size: .9rem; font-weight: 600; }
.entrada-demo { font-size: .82rem !important; color: var(--ink-3) !important; }
.carregando { min-height: 100vh; display: grid; place-items: center; color: var(--ink-3); font-size: 1rem; }
.carregando .spin { width: 2.4rem; height: 2.4rem; margin: 0 auto .8rem; border-radius: 50%; border: .25rem solid var(--surface-3); border-top-color: var(--brand); animation: gira .9s linear infinite; }


/* =========================================================
   TEMA CANELA (o mesmo do backoffice): papel quadriculado, contornos de chocolate e tons pastel.
   Vale quando este aparelho escolheu Canela no backoffice, ou com ?tema=canela no endereço.
========================================================= */
:root[data-theme="canela"] {
  --bg: #FFF4CC; --surface: #FFFBEA; --surface-2: #FFFDF4; --surface-3: #F5E3A8;
  --line: rgba(74, 36, 24, .14); --line-2: rgba(74, 36, 24, .3);
  --ink: #4A2418; --ink-2: #6B3A26; --ink-3: #7D4A33;
  --critical: #B3261E; --critical-bg: rgba(255, 138, 91, .26); --critical-line: rgba(179, 38, 30, .6);
  --warning: #7F5410; --warning-bg: rgba(253, 214, 110, .5);
  --good: #2F6B45; --good-bg: rgba(150, 205, 168, .4);
  --brand: #8E3A69; --brand-bg: rgba(220, 198, 240, .75);
  --gold: #6B4A0E; --gold-bg: rgba(253, 232, 162, .95);
  --font-ui: 'Source Serif 4', Georgia, serif; --font-display: 'Fraunces', Georgia, serif;
  --contorno: #4A2418; --grade: rgba(140, 158, 226, .3);
  color-scheme: light;
}
[data-theme="canela"] body { background: var(--bg); background-image: linear-gradient(var(--grade) 1px, transparent 1px), linear-gradient(90deg, var(--grade) 1px, transparent 1px); background-size: 1.6rem 1.6rem; background-position: -1px -1px; }

[data-theme="canela"] .barra { height: 1.35rem; border: 2px solid var(--contorno); border-radius: 999px; background: var(--surface-3); }
[data-theme="canela"] .seg + .seg { margin-left: 0; border-left: 2px solid var(--contorno); }
/* colunas e painel de produção como cartões de contorno marrom */
[data-theme="canela"] .coluna, [data-theme="canela"] .producao { border: 2px solid var(--contorno); border-radius: 1.3rem; box-shadow: 0 .3rem 0 rgba(74, 36, 24, .14); }
[data-theme="canela"] .producao { background: linear-gradient(180deg, rgba(220, 198, 240, .5), rgba(220, 198, 240, .18) 9rem, transparent 18rem), var(--surface); }
[data-theme="canela"] .producao { --cor: linear-gradient(90deg, #A5B6EC, #DCC6F0, #FF8A5B); }
[data-theme="canela"] .coluna::before, [data-theme="canela"] .producao::before { height: .45rem; border-bottom: 2px solid var(--contorno); }
[data-theme="canela"] .p-linha { border-bottom-style: dashed; }
[data-theme="canela"] .grupo::after { background: none; border-top: 2px dashed rgba(74, 36, 24, .22); }
/* cartões dos pedidos */
[data-theme="canela"] .cartao { background: var(--surface-2); border: 1.5px solid rgba(74, 36, 24, .5); box-shadow: 0 .2rem 0 rgba(74, 36, 24, .12); }
[data-theme="canela"] .cartao.atrasado { border-color: var(--critical-line); background: linear-gradient(var(--critical-bg), var(--critical-bg)), var(--surface-2); box-shadow: inset .32rem 0 0 #E0582E, 0 .2rem 0 rgba(74, 36, 24, .12); }
[data-theme="canela"] .cartao.em-breve, [data-theme="canela"] .cartao.esperando { box-shadow: inset .32rem 0 0 #E8B53A, 0 .2rem 0 rgba(74, 36, 24, .12); }
[data-theme="canela"] .cartao.novo { border-color: #8E3A69; box-shadow: 0 0 0 2px rgba(220, 198, 240, .95), 0 .2rem 0 rgba(74, 36, 24, .12); animation: none; }
[data-theme="canela"] .c-quem { border-left-color: rgba(74, 36, 24, .25); }
[data-theme="canela"] .c-itens { border-top-style: dashed; }
[data-theme="canela"] .c-nota { box-shadow: inset 0 0 0 1px rgba(74, 36, 24, .18); }
[data-theme="canela"] .ficha { box-shadow: inset 0 0 0 1.2px rgba(74, 36, 24, .22); }
/* aviso de pedido novo, controles e tela de entrada (no tema escuro eles têm fundo escuro fixo) */

[data-theme="canela"] .kpi-rot { font-size: .76rem; }

/* ---------- Animações ---------- */
@keyframes vivo { 0% { box-shadow: 0 0 0 0 rgba(142, 217, 169, .55); } 70%, 100% { box-shadow: 0 0 0 .5rem rgba(142, 217, 169, 0); } }
@keyframes pulso { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 134, 118, 0); } 50% { box-shadow: 0 0 0 .3rem rgba(255, 134, 118, .18); } }
@keyframes brilho { 0%, 100% { box-shadow: 0 0 0 1px rgba(244, 175, 194, .5), 0 0 1.6rem rgba(244, 175, 194, .22); } 50% { box-shadow: 0 0 0 3px rgba(244, 175, 194, .85), 0 0 3rem rgba(244, 175, 194, .45); } }
@keyframes chegou { 0% { box-shadow: 0 0 0 3px rgba(255, 241, 230, .9), 0 0 2.4rem rgba(255, 241, 230, .35); } 100% { box-shadow: 0 0 0 0 rgba(255, 241, 230, 0), 0 .45rem 1.2rem rgba(0, 0, 0, .2); } }
@keyframes gira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- TV na vertical ---------- */
@media (orientation: portrait) and (min-width: 1000px) {
  :root { font-size: min(1.852vw, 1.0417vh); }
  .topo { grid-template-columns: minmax(0, 1fr) auto; row-gap: 1rem; }
  .agora { grid-column: 2; grid-row: 1; }
  .kpis { grid-column: 1 / -1; grid-row: 2; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi-hoje { grid-column: 1 / -1; }
  .painel { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: var(--linhas-vertical, minmax(0, 1fr)); }
  .producao { grid-column: 1 / -1; }
}

/* ---------- Celular e telas pequenas: vira lista que rola ---------- */
@media (max-width: 999px) and (orientation: portrait), (max-width: 760px), (max-height: 500px) {
  :root { font-size: 15px; }
  body { overflow: auto; height: auto; }
  .quadro { height: auto; min-height: 100vh; padding: 1rem; }
  .topo { grid-template-columns: minmax(0, 1fr) auto; row-gap: .9rem; }
  .marca img { width: 3rem; height: 3rem; }
  .marca strong { font-size: 1.25rem; }
  .agora { grid-column: 2; grid-row: 1; min-width: 0; }
  .agora .data { font-size: .78rem; }
  .agora .hora { font-size: 2.2rem; }
  .kpis { grid-column: 1 / -1; grid-row: 2; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
  .kpi-hoje { grid-column: 1 / -1; }
  .kpi:not(.kpi-hoje) { grid-template-columns: minmax(0, 1fr); padding: .7rem .75rem; }
  .kpi:not(.kpi-hoje) .kpi-ic { display: none; }
  .kpi:not(.kpi-hoje) .kpi-rot, .kpi:not(.kpi-hoje) .kpi-sub { white-space: normal; overflow-wrap: anywhere; }
  .kpi-val { font-size: 1.8rem; }
  .painel { display: grid; grid-template-columns: minmax(0, 1fr); }
  .rolo { overflow: visible; }
  .trilho { transform: none !important; }
  .cartao.fora { opacity: 1; }
  .controles { display: none; }
}
